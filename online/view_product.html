<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات - لوحة التحكم</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0e14;--bg2:#12151e;--card:#181c28;--card2:#1e2233;--border:#262b3d;--accent:#e8a838;--accent2:#f0c060;--accent-bg:rgba(232,168,56,.07);--green:#22c55e;--green-bg:rgba(34,197,94,.1);--red:#ef4444;--red-bg:rgba(239,68,68,.1);--blue:#3b82f6;--blue-bg:rgba(59,130,246,.1);--text:#e4e2de;--text2:#7c8194;--text3:#505468}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;position:relative;overflow:hidden;transition:all .3s}
.stat-card:hover{border-color:rgba(232,168,56,.25);transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .35s cubic-bezier(.4,0,.2,1);position:relative}
.prod-card:hover{border-color:rgba(232,168,56,.3);box-shadow:0 8px 32px rgba(0,0,0,.25);transform:translateY(-4px)}
.prod-card.inactive{opacity:.55;filter:grayscale(.3)}
.prod-card.inactive:hover{opacity:.8;filter:grayscale(.1)}
.prod-img{width:100%;height:180px;object-fit:cover;transition:transform .4s}
.prod-card:hover .prod-img{transform:scale(1.05)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-accent{background:var(--accent-bg);color:var(--accent)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .2s;font-family:'Cairo'}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,.2)}.btn-green:hover{background:var(--green);color:#fff}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.2)}.btn-red:hover{background:var(--red);color:#fff}
.btn-blue{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,.2)}.btn-blue:hover{background:var(--blue);color:#fff}
.btn-sm{padding:5px 10px;font-size:10px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px}
.input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Cairo');width:100%;transition:border-color .2s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,168,56,.08)}
.select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Cairo');width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;backdrop-filter:blur(4px);overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:780px;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2;border-radius:16px 16px 0 0}
.modal-body{padding:24px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start;position:sticky;bottom:0;background:var(--card);border-radius:0 0 16px 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px}
.field .req{color:var(--red);margin-right:2px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.toast{position:fixed;bottom:24px;left:24px;background:var(--card2);border:1px solid var(--accent);color:var(--accent);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;animation:toastIn .3s ease;display:none}
.toast.show{display:block}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.detail-row{display:flex;padding:7px 0;border-bottom:1px solid rgba(38,43,61,.5);font-size:12px}
.detail-label{min-width:160px;color:var(--text2);font-weight:600;flex-shrink:0}
.detail-val{color:var(--text);font-weight:500;flex:1;word-break:break-all}
.bg-dots{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.025;background-image:radial-gradient(circle,var(--accent) 1px,transparent 1px);background-size:40px 40px}
.glow-1{position:fixed;top:-150px;right:-100px;width:500px;height:500px;background:var(--accent);border-radius:50%;filter:blur(150px);pointer-events:none;opacity:.04;z-index:0}
.glow-2{position:fixed;bottom:-200px;left:-100px;width:400px;height:400px;background:#6366f1;border-radius:50%;filter:blur(130px);pointer-events:none;opacity:.03;z-index:0}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--border);cursor:pointer;position:relative;transition:background .25s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(-18px)}
.price-tag{font-family:'Cairo',monospace;font-weight:800;letter-spacing:.5px}
@media(max-width:768px){.fg2,.fg3{grid-template-columns:1fr}.prod-grid{grid-template-columns:1fr!important}.detail-row{flex-direction:column;gap:2px}.detail-label{min-width:auto}}
@media print{body{background:#fff!important;color:#000!important}.topbar,.no-print,.glow-1,.glow-2,.bg-dots{display:none!important}.prod-card{break-inside:avoid;border:1px solid #ddd!important;box-shadow:none!important;animation:none!important;transform:none!important}.prod-card:hover{transform:none!important;box-shadow:none!important}.stat-card{break-inside:avoid;border:1px solid #ddd!important;background:#f9f9f9!important}.print-header{display:block!important;text-align:center;margin-bottom:20px;padding-bottom:10px;border-bottom:3px double #333}}
.print-header{display:none}
</style>
</head>

var lang = 'ar';
var state = {search:'',filterCat:'all',filterStatus:'all',editId:null,view:'grid'};
function t(k){return T[lang][k]||k;}
function fmtN(n){return Number(n).toLocaleString(lang==='ar'?'ar-SA':'en-US');}

// ============ الإحصائيات ============
function getStats(){
  return {
    total: products.length,
    active: products.filter(function(p){return p.active;}).length,
    inactive: products.filter(function(p){return !p.active;}).length,
    lowStock: products.filter(function(p){return p.active && p.qtyAvailable > 0 && p.qtyAvailable <= p.minQty;}).length
  };
}

// ============ الفلاتر ============
function getFiltered(){
  var q = state.search.toLowerCase();
  return products.filter(function(p){
    if(state.filterStatus==='active' && !p.active) return false;
    if(state.filterStatus==='inactive' && p.active) return false;
    if(state.filterCat!=='all' && p.category!==state.filterCat) return false;
    if(q && !(p.name.toLowerCase().includes(q)||p.barcode.includes(q)||p.brand.toLowerCase().includes(q)||p.supplier.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))) return false;
    return true;
  });
}

function getCategories(){
  var cats = [];
  products.forEach(function(p){if(cats.indexOf(p.category)===-1)cats.push(p.category);});
  return cats;
}

        <option value="all">'+t('filter')+': '+t('all')+'</option>\
        '+cats.map(function(c){return '<option value="'+c+'" '+(state.filterCat===c?'selected':'')+'>'+c+'</option>';}).join('')+ '\
      </select>\
      <select class="select" style="width:auto;min-width:120px;font-size:11px;padding:6px 10px" onchange="handleStatusFilter(this.value)">\

        <option value="active" '+(state.filterStatus==='active'?'selected':'')+'>'+t('activeStatus')+'</option>\
        <option value="inactive" '+(state.filterStatus==='inactive'?'selected':'')+'>'+t('inactiveStatus')+'</option>\

function renderContent(){

  var html = '<div class="print-header"><h1 style="font-size:20px;font-weight:900">'+t('products')+'</h1></div>';

  // الإحصائيات
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px">';
  html += statCard(t('total'),stats.total,'fa-boxes-stacked','var(--accent)','#e8a838');
  html += statCard(t('active'),stats.active,'fa-check-circle','var(--green)','#22c55e');
  html += statCard(t('inactive'),stats.inactive,'fa-ban','var(--red)','#ef4444');
  html += statCard(t('lowStock'),stats.lowStock,'fa-exclamation-triangle','var(--accent2)','#f59e0b');
  html += '</div>';

  // الشبكة أو الجدول
  if(filtered.length===0){
    html += '<div style="text-align:center;padding:60px;color:var(--text3)"><i class="fas fa-search" style="font-size:40px;margin-bottom:16px;display:block;opacity:.3"></i>'+t('noResults')+'</div>';
  } else {
    if(state.view==='grid'){
      html += '<div class="prod-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">';
      filtered.forEach(function(p,i){html += renderProductCard(p,i);});
      html += '</div>';
    } else {
      html += renderTableView(filtered);
    }
    html += '<div style="text-align:center;padding:14px;color:var(--text3);font-size:12px">'+filtered.length+' '+lang==='ar'?'من':'of'+' '+products.length+' '+t('products')+'</div>';
  }

  document.getElementById('contentArea').innerHTML = html;
}

function statCard(label,val,icon,color,bg){
  return '<div class="stat-card" style="animation:fadeUp .4s ease both">\
    <div style="position:absolute;top:0;right:0;left:0;height:3px;background:'+color+';border-radius:14px 14px 0 0"></div>\
    <div style="display:flex;align-items:center;justify-content:space-between">\
      <div><div style="font-size:26px;font-weight:900;color:'+color+'">'+fmtN(val)+'</div><div style="font-size:11px;color:var(--text2);margin-top:2px">'+label+'</div></div>\
      <div style="width:44px;height:44px;border-radius:12px;background:'+bg+'22;display:flex;align-items:center;justify-content:center"><i class="fas '+icon+'" style="color:'+color+';font-size:16px"></i></div>\
    </div></div>';
}

        '+(isLow?'<span class="badge badge-accent"><i class="fas fa-exclamation" style="font-size:8px"></i> '+t('lowStockWarn')+'</span>':'')+'\

      </div>\
      <div style="position:absolute;top:10px;left:10px"><span class="badge badge-blue" style="font-family:monospace;font-size:9px">'+p.barcode+'</span></div>\
    </div>\
    <div style="padding:16px">\
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">\
        <span class="badge badge-accent">'+p.category+'</span>\
        <span class="badge" style="background:var(--card2);color:var(--text2)">'+p.subcategory+'</span>\
      </div>\
      <h3 style="font-size:14px;font-weight:800;margin-bottom:6px;line-height:1.5">'+p.name+'</h3>\
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">\
        <i class="fas fa-tag" style="color:var(--accent);font-size:10px"></i>\

        <span style="color:var(--border);margin:0 2px">|</span>\

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;padding:10px;background:var(--bg);border-radius:8px">\
        <div><div style="font-size:9px;color:var(--text3)">'+t('sellingPrice')+'</div><div class="price-tag" style="font-size:16px;color:var(--green)">'+fmtN(totalWithTax)+' <span style="font-size:10px;font-weight:400;color:var(--text3)">'+t('EGP')+'</span></div></div>\
        <div><div style="font-size:9px;color:var(--text3)">'+t('costPrice')+'</div><div class="price-tag" style="font-size:13px;color:var(--text2)">'+fmtN(p.costPrice)+' <span style="font-size:10px;font-weight:400;color:var(--text3)">'+t('EGP')+'</span></div></div>\

        <div style="width:1px;height:28px;background:var(--border)"></div>\
        <div style="text-align:center;flex:1"><div style="font-size:9px;color:var(--text3)">'+t('unit')+'</div><div style="font-size:12px;font-weight:700;color:var(--text2)">'+p.unit+'</div></div>\

function viewProduct(id){
  var p = products.find(function(x){return x.id===id;});
  if(!p) return;
  var taxAmt = Math.round(p.sellingPrice * p.tax / 100);
  var totalWithTax = p.sellingPrice + taxAmt;
  var profit = p.sellingPrice - p.costPrice;
  var profitPct = p.costPrice > 0 ? Math.round((profit / p.costPrice) * 100) : 0;

  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailBody').innerHTML = '\
    <div style="margin-bottom:20px"><img src="'+p.image+'" style="width:100%;height:200px;object-fit:cover;border-radius:10px" alt=""></div>\
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">\

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">\
      <div style="background:var(--bg);padding:12px;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--text3)">'+t('costPrice')+'</div><div class="price-tag" style="font-size:18px;color:var(--text2)">'+fmtN(p.costPrice)+' '+t('EGP')+'</div></div>\
      <div style="background:var(--bg);padding:12px;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--text3)">'+t('sellingPrice')+' ('+t('tax')+' '+p.tax+'%)</div><div class="price-tag" style="font-size:18px;color:var(--green)">'+fmtN(totalWithTax)+' '+t('EGP')+'</div></div>\

    </div>\
    <div class="fg3">\
      <div class="field"><label>'+t('size')+'</label><input class="input" id="ef_size" value="'+v('size')+'"></div>\
      <div class="field"><label>'+t('weight')+'</label><input class="input" id="ef_weight" value="'+v('weight')+'"></div>\
      <div class="field"><label>'+t('length')+'</label><input class="input" id="ef_length" value="'+v('length')+'"></div>\
    </div>\
    <div class="fg3">\
      <div class="field"><label>'+t('qtyAvailable')+' <span class="req">*</span></label><input class="input" id="ef_qty" type="number" value="'+v('qtyAvailable')+'"></div>\
      <div class="field"><label>'+t('minQty')+' <span class="req">*</span></label><input class="input" id="ef_minQty" type="number" value="'+v('minQty')+'"></div>\
      <div class="field"><label>'+t('maxQty')+'</label><input class="input" id="ef_maxQty" type="number" value="'+v('maxQty')+'"></div>\
    </div>\
    <div class="field"><label>'+t('image')+' (URL)</label><input class="input" id="ef_image" value="'+v('image')+'" placeholder="https://..."></div>';
  document.getElementById('editModal').classList.add('show');
}

function openAddModal(){openEditModal(null);}

function saveProduct(){
  var gv = function(id){var el=document.getElementById(id);return el?el.value.trim():'';};
  var gn = function(id){var el=document.getElementById(id);return el?parseFloat(el.value)||0:0;};
  var name=gv('ef_name'),barcode=gv('ef_barcode');
  if(!name||!barcode){showToast(lang==='ar'?'اسم المنتج والباركود مطلوبان':'Product name and barcode are required','error');return;}

  var data = {
    name:name,barcode:barcode,
    supplier:gv('ef_supplier'),branch:gv('ef_branch'),
    category:gv('ef_category'),subcategory:gv('ef_subcategory'),brand:gv('ef_brand'),
    unit:gv('ef_unit'),tax:gn('ef_tax'),
    description:gv('ef_desc'),
    costPrice:gn('ef_cost'),purchasePrice:gn('ef_purchase'),sellingPrice:gn('ef_selling'),
    size:gv('ef_size'),weight:gv('ef_weight'),length:gv('ef_length'),
    qtyAvailable:gn('ef_qty'),minQty:gn('ef_minQty'),maxQty:gn('ef_maxQty'),
    image:gv('ef_image')||'https://picsum.photos/seed/new-'+Date.now()+'/400/300.jpg'
  };

  if(state.editId){
    var idx = products.findIndex(function(p){return p.id===state.editId;});
    if(idx>=0){Object.assign(products[idx],data);}
    showToast(lang==='ar'?'تم تحديث المنتج بنجاح':'Product updated successfully','success');
  } else {
    data.id = Math.max.apply(null,products.map(function(p){return p.id;}))+1;
    data.active = true;
    products.push(data);
    showToast(lang==='ar'?'تم إضافة المنتج بنجاح':'Product added successfully','success');
  }
  closeModal();
  renderAll();
}

function closeModal(){document.getElementById('editModal').classList.remove('show');state.editId=null;}

// ============ التفعيل / الإلغاء ============
function toggleActive(id){
  var p = products.find(function(x){return x.id===id;});
  if(!p) return;
  p.active = !p.active;
  showToast(p.active?(lang==='ar'?'تم تفعيل المنتج':'Product activated'):(lang==='ar'?'تم إلغاء تفعيل المنتج':'Product deactivated'),p.active?'success':'warn');
  renderAll();
}

// ============ الحذف ============
var deleteTargetId = null;
function confirmDelete(id){
  deleteTargetId = id;
  var p = products.find(function(x){return x.id===id;});
  document.getElementById('confirmText').textContent = t('confirmDelete')+'\n'+p.name;
  document.getElementById('confirmDeleteBtn').onclick = function(){executeDelete();};
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show');deleteTargetId=null;}
function executeDelete(){
  products = products.filter(function(p){return p.id!==deleteTargetId;});
  closeConfirm();
  showToast(lang==='ar'?'تم حذف المنتج بنجاح':'Product deleted successfully','success');
  renderAll();
}

// ============ الأدوات ============
function handleSearch(q){state.search=q;renderContent();}
function handleCatFilter(v){state.filterCat=v;renderContent();}
function handleStatusFilter(v){state.filterStatus=v;renderContent();}

function toggleLang(){
  lang = lang==='ar'?'en':'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  renderAll();
}

function handlePrint(){
  var pa = document.getElementById('printArea');
  pa.style.display = 'block';
  var taxAmt = function(p){return Math.round(p.sellingPrice*p.tax/100);};
  pa.innerHTML = '<div class="print-header" style="display:block!important;text-align:center;margin-bottom:20px;padding-bottom:10px;border-bottom:3px double #333"><h1 style="font-size:20px;font-weight:900;margin:0">'+t('products')+'</h1><p style="font-size:12px;color:#666">'+products.length+' '+t('products')+'</p></div>\
  <table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:#f0f0f0">\
  <th style="border:1px solid #ccc;padding:6px;text-align:right">#</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('name')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('barcode')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('supplier')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('category')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('brand')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('costPrice')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('sellingPrice')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('tax')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">'+t('qtyAvailable')+'</th><th style="border:1px solid #ccc;padding:6px;text-align:right">الحالة</th></tr></thead><tbody>'
  +products.map(function(p,i){return '<tr><td style="border:1px solid #ccc;padding:5px">'+(i+1)+'</td><td style="border:1px solid #ccc;padding:5px;font-weight:600">'+p.name+'</td><td style="border:1px solid #ccc;padding:5px;direction:ltr;font-family:monospace">'+p.barcode+'</td><td style="border:1px solid #ccc;padding:5px">'+p.supplier+'</td><td style="border:1px solid #ccc;padding:5px">'+p.category+'</td><td style="border:1px solid #ccc;padding:5px">'+p.brand+'</td><td style="border:1px solid #ccc;padding:5px">'+fmtN(p.costPrice)+'</td><td style="border:1px solid #ccc;padding:5px;font-weight:700">'+fmtN(p.sellingPrice+taxAmt(p))+'</td><td style="border:1px solid #ccc;padding:5px">'+p.tax+'%</td><td style="border:1px solid #ccc;padding:5px;font-weight:700">'+fmtN(p.qtyAvailable)+'</td><td style="border:1px solid #ccc;padding:5px">'+(p.active?t('activeStatus'):t('inactiveStatus'))+'</td></tr>';}).join('')
  +'</tbody></table>';
  window.print();
  setTimeout(function(){pa.style.display='none';},500);
}

function showToast(msg,type){
  var colors={success:'var(--green)',error:'var(--red)',warn:'var(--accent)'};
  var icons={success:'fa-check-circle',error:'fa-times-circle',warn:'fa-exclamation-triangle'};
  var el = document.getElementById('toast');
  el.style.borderColor = colors[type]||colors.success;
  el.style.color = colors[type]||colors.success;
  el.innerHTML = '<i class="fas '+(icons[type]||icons.success)+'" style="margin-left:8px"></i>'+msg;
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2500);
}

function renderAll(){renderTopbar();renderContent();}

// ============ التهيئة ============
renderAll();
</script>
