    <style>
        :root{--brand:#F96316;--ink:#1A1A2E;--border:#EDEAE5;--surface:#FAFAF8;--success:#10B981;--danger:#EF4444}

        .gallery-thumb{width:80px;height:80px;border-radius:14px;overflow:hidden;border:2px solid var(--border);cursor:pointer;transition:all .25s;flex-shrink:0;position:relative}
        .gallery-thumb.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,99,22,.15)}
        .gallery-thumb:hover{border-color:#9CA3AF}
        .gallery-thumb img{width:100%;height:100%;object-fit:cover}
        .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.1);z-index:2}
        .gallery-nav:hover{background:white;box-shadow:0 4px 16px rgba(0,0,0,.15)}
        .gallery-nav.prev{right:12px}
        .gallery-nav.next{left:12px}
        body.ltr .gallery-nav.prev{right:auto;left:12px}
        body.ltr .gallery-nav.next{left:auto;right:12px}

        /* شارة التخفيض */
        .discount-badge{position:absolute;top:16px;left:16px;background:var(--danger);color:white;font-size:13px;font-weight:800;padding:6px 14px;border-radius:12px;z-index:3;box-shadow:0 4px 12px rgba(239,68,68,.3)}

        /* أزرار */
        .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,#F96316,#E84B07);color:white;border:none;border-radius:16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,99,22,.35)}
        .btn-primary:active{transform:translateY(0)}
        .btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:white;color:var(--ink);border:2px solid var(--border);border-radius:16px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .3s}
        .btn-secondary:hover{border-color:#9CA3AF;background:#FAFAF8}
        .btn-icon{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;border:2px solid var(--border);background:white;cursor:pointer;transition:all .25s;color:#6B7280}
        .btn-icon:hover{border-color:var(--brand);color:var(--brand);background:#FFF4ED}

        /* كميات */
        .qty-btn{width:40px;height:40px;border-radius:12px;border:2px solid var(--border);background:white;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:14px;color:var(--ink);font-weight:700}
        .qty-btn:hover{border-color:var(--brand);color:var(--brand);background:#FFF4ED}
        .qty-btn:active{transform:scale(.92)}

        /* تاب الوصف */
        .tab-btn{padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;color:#6B7280;background:transparent;border:none;font-family:inherit;white-space:nowrap}
        .tab-btn:hover{color:var(--ink);background:#F5F3F0}
        .tab-btn.active{color:white;background:var(--brand);box-shadow:0 4px 12px rgba(249,99,22,.25)}
        .tab-content{display:none}.tab-content.active{display:block}

        /* نجوم */
        .star-fill{color:#F59E0B}.star-empty{color:#E5E7EB}

        /* مراجعة */
        .review-card{border:1px solid var(--border);border-radius:16px;padding:20px;transition:box-shadow .3s}
        .review-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.04)}
        .review-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}

        /* بطاقة منتج مشابه */
        .similar-card{background:white;border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer}
        .similar-card:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(0,0,0,.08);border-color:transparent}
        .similar-card:hover img{transform:scale(1.06)}
        .similar-card img{transition:transform .5s cubic-bezier(.4,0,.2,1)}

        /* مخزون */
        .stock-bar{height:6px;background:#EDEAE5;border-radius:6px;overflow:hidden}
        .stock-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)}

        /* أنيميشن */
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .fade-up{animation:fadeUp .5s ease both}
        @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
        .slide-in{animation:slideIn .4s ease both}
        @keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(20px)}}
        .toast-in{animation:toastIn .35s ease}.toast-out{animation:toastOut .3s ease forwards}
        @keyframes flyToCart{0%{opacity:1;transform:translate(0,0) scale(1)}50%{opacity:.7}100%{opacity:0;transform:translate(var(--ex),var(--ey)) scale(.15)}}
        .fly-dot{position:fixed;width:14px;height:14px;border-radius:50%;background:var(--brand);z-index:9999;pointer-events:none;box-shadow:0 4px 12px rgba(249,99,22,.5);animation:flyToCart .6s cubic-bezier(.4,0,.2,1) forwards}
        @keyframes cartBounce{0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.9)}100%{transform:scale(1)}}
        .cart-bounce{animation:cartBounce .5s ease}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .stock-pulse{animation:pulse 2s ease-in-out infinite}

        /* لوحة الصور المكبّرة */
        .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:none;align-items:center;justify-content:center;cursor:zoom-out}
        .lightbox.open{display:flex}
        .lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

            .gallery-thumb{width:60px;height:60px;border-radius:10px}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>

    const disc=product.oldPrice?Math.round(((product.oldPrice-product.price)/product.oldPrice)*100):0;
    const stockPct=Math.round((product.stock/product.maxStock)*100);
    const stockColor=stockPct>40?'#10B981':stockPct>15?'#F59E0B':'#EF4444';
    const fewStock=product.stock<=15&&product.stock>0;

    document.getElementById('productSection').innerHTML=`
    <!-- معرض الصور -->
    <div class="fade-up">
        <div class="gallery-main" id="mainGallery" onclick="openLightbox()">
            ${disc?`<span class="discount-badge">-${disc}%</span>`:''}
            <button class="gallery-nav prev" onclick="event.stopPropagation();changeImg(-1)"><i class="fas fa-chevron-right text-sm text-ink-700"></i></button>
            <img src="${product.images[currentImg]}" alt="${nm}" id="mainImg">
            <button class="gallery-nav next" onclick="event.stopPropagation();changeImg(1)"><i class="fas fa-chevron-left text-sm text-ink-700"></i></button>
        </div>
        <div class="flex gap-3 mt-4 overflow-x-auto pb-1" id="thumbBar">
            ${product.images.map((img,i)=>`<div class="gallery-thumb ${i===currentImg?'active':''}" onclick="setImg(${i})"><img src="${img}" alt=""></div>`).join('')}
        </div>
    </div>

    <!-- تفاصيل المنتج -->
    <div class="slide-in">
        <span class="text-xs font-bold text-brand-500 bg-brand-50 px-3 py-1 rounded-lg inline-block mb-3">${product.brand}</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-ink-900 leading-tight mb-4">${nm}</h1>

        <!-- التقييم -->
        <div class="flex items-center gap-3 mb-5">
            <div class="flex items-center gap-1">${rStars(product.rating)}</div>
            <span class="text-sm font-bold text-ink-900">${product.rating}</span>
            <span class="text-sm text-ink-400">(${product.reviewCount.toLocaleString()} ${t('reviews_count')})</span>
        </div>

        <!-- السعر -->
        <div class="flex items-end gap-3 mb-5">
            <span class="text-3xl font-extrabold text-ink-900">${product.storageOpts[product.selectedStorage].price.toLocaleString()} <span class="text-sm font-normal text-ink-500">${t('currency')}</span></span>
            ${product.oldPrice?`<span class="text-lg text-ink-300 line-through">${product.oldPrice.toLocaleString()} ${t('currency')}</span>`:''}
            ${disc?`<span class="bg-red-50 text-red-600 text-xs font-bold px-2.5 py-1 rounded-lg">${disc}% ${t('discount')}</span>`:''}
        </div>

        <!-- المخزون -->
        <div class="mb-5 p-4 ${fewStock?'bg-amber-50 border border-amber-200':'bg-emerald-50 border border-emerald-200'} rounded-xl">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-semibold ${fewStock?'text-amber-700':'text-emerald-700'} flex items-center gap-2">
                    <i class="fas ${fewStock?'fa-exclamation-triangle stock-pulse':'fa-check-circle'} text-xs"></i>
                    ${fewStock?t('few_left'):t('in_stock')}
                </span>
                ${fewStock?`<span class="text-xs font-bold text-amber-600">${t('stock_left')} ${product.stock} ${t('stock_pieces')}</span>`:''}
            </div>
            <div class="stock-bar"><div class="stock-fill" style="width:${stockPct}%;background:${stockColor}"></div></div>
        </div>

        <!-- الألوان -->
        <div class="mb-5">
            <span class="text-sm font-bold text-ink-900 mb-3 block">${t('color')}: <span class="text-brand-500" id="colorName">${lang==='en'?product.colors[product.selectedColor].nameEn:product.colors[product.selectedColor].name}</span></span>
            <div class="flex gap-3">
                ${product.colors.map((c,i)=>`<button onclick="selectColor(${i})" class="w-10 h-10 rounded-full border-2 transition-all ${i===product.selectedColor?'border-brand-500 ring-2 ring-brand-200 scale-110':'border-surface-300 hover:border-ink-400'}" style="background:${c.hex}" title="${lang==='en'?c.nameEn:c.name}"></button>`).join('')}
            </div>
        </div>

        <!-- التخزين -->
        <div class="mb-6">
            <span class="text-sm font-bold text-ink-900 mb-3 block">${t('storage')}</span>
            <div class="flex flex-wrap gap-2">
                ${product.storageOpts.map((s,i)=>`<button onclick="selectStorage(${i})" class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all ${i===product.selectedStorage?'bg-ink-900 text-white shadow-lg':'bg-white border-2 border-surface-200 text-ink-700 hover:border-ink-400'}">${s.label} - ${s.price.toLocaleString()} ${t('currency')}</button>`).join('')}
            </div>
        </div>

        <!-- الكمية والأزرار -->
        <div class="flex items-center gap-3 mb-5">
            <div class="flex items-center gap-2 bg-surface-100 rounded-xl p-1">
                <button class="qty-btn" onclick="changeQty(-1)"><i class="fas fa-minus" style="font-size:10px"></i></button>
                <span class="w-10 text-center text-base font-bold" id="qtyDisplay">${product.qty}</span>
                <button class="qty-btn" onclick="changeQty(1)"><i class="fas fa-plus" style="font-size:10px"></i></button>
            </div>
            <span class="text-xs text-ink-400">${t('stock_left')} ${product.stock} ${t('stock_pieces')}</span>
        </div>

        <div class="flex gap-3 mb-6">
            <button onclick="addToCart(event)" class="btn-primary flex-1 justify-center"><i class="fas fa-cart-plus text-sm"></i>${t('add_cart')}</button>
            <button onclick="buyNow()" class="btn-secondary flex-1 justify-center"><i class="fas fa-bolt text-sm"></i>${t('buy_now')}</button>
            <button onclick="toggleWish()" class="btn-icon" id="wishBtn" title="${t('add_wish')}"><i class="${inWishlist?'fas':'far'} fa-heart ${inWishlist?'text-red-500':''} text-lg"></i></button>
        </div>

        <!-- مميزات إضافية -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="info-chip justify-center"><i class="fas fa-truck text-brand-500 text-xs"></i>${t('free_ship')}</div>
            <div class="info-chip justify-center"><i class="fas fa-undo-alt text-emerald-500 text-xs"></i>${t('return_policy')}</div>
            <div class="info-chip justify-center"><i class="fas fa-shield-alt text-sky-500 text-xs"></i>${t('authentic')}</div>
            <div class="info-chip justify-center"><i class="fas fa-certificate text-amber-500 text-xs"></i>${t('warranty')}</div>
        </div>

        <!-- معلومات الشحن -->
        <div class="mt-5 flex items-center gap-3 text-xs text-ink-500">
            <i class="fas fa-shipping-fast text-brand-400"></i>
            <span>${t('ships_in')} <strong class="text-ink-900">2-3</strong> ${t('days')}</span>
            <span class="text-surface-300">|</span>
            <span>${t('sku')}: <strong class="text-ink-900 font-mono">APL-15PM-256</strong></span>
        </div>
    </div>`;
}

function changeImg(d){currentImg=(currentImg+d+product.images.length)%product.images.length;updateGallery();}
function setImg(i){currentImg=i;updateGallery();}
function updateGallery(){
    document.getElementById('mainImg').src=product.images[currentImg];
    document.querySelectorAll('.gallery-thumb').forEach((t,i)=>t.classList.toggle('active',i===currentImg));
    const bar=document.getElementById('thumbBar');
    const active=bar.children[currentImg];
    if(active)active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function selectColor(i){product.selectedColor=i;renderProduct();}
function selectStorage(i){product.selectedStorage=i;renderProduct();}
function changeQty(d){product.qty=Math.max(1,Math.min(product.stock,product.qty+d));document.getElementById('qtyDisplay').textContent=product.qty;}

function addToCart(event){
    if(event)flyEffect(event);
    cartCount+=product.qty;
    const badge=document.getElementById('cartBadge');badge.textContent=cartCount;badge.classList.remove('hidden');badge.classList.remove('cart-bounce');void badge.offsetWidth;badge.classList.add('cart-bounce');
    toast(t('added'),'success');
}
function buyNow(){addToCart(null);toast(t('buy_now'),'success');}
function toggleWish(){
    inWishlist=!inWishlist;
    const btn=document.getElementById('wishBtn');
    btn.innerHTML=`<i class="${inWishlist?'fas':'far'} fa-heart ${inWishlist?'text-red-500':''} text-lg"></i>`;
    btn.title=inWishlist?t('remove_wish'):t('add_wish');
    toast(inWishlist?t('wish_added'):t('wish_removed'),inWishlist?'success':'info');
}

function flyEffect(event){
    const btn=event.currentTarget||event.target;const rect=btn.getBoundingClientRect();
    const cartEl=document.getElementById('cartTrigger');const cr=cartEl.getBoundingClientRect();
    const dot=document.createElement('div');dot.className='fly-dot';
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    dot.style.left=cx+'px';dot.style.top=cy+'px';
    dot.style.setProperty('--ex',(cr.left+cr.width/2-cx)+'px');dot.style.setProperty('--ey',(cr.top+cr.height/2-cy)+'px');
    document.body.appendChild(dot);setTimeout(()=>dot.remove(),650);
    const badge=document.getElementById('cartBadge');badge.classList.remove('cart-bounce');void badge.offsetWidth;badge.classList.add('cart-bounce');
}

// ========== التابز ==========
function renderTabs(){
    const nm=lang==='en'?product.nameEn:product.name;
    const desc=lang==='en'?product.desc_en:product.desc_ar;
    document.getElementById('tabsSection').innerHTML=`
    <div class="bg-white border border-surface-200 rounded-2xl p-6 sm:p-8">
        <div class="flex gap-2 mb-6 overflow-x-auto pb-1" style="scrollbar-width:none">
            <button class="tab-btn ${activeTab==='desc'?'active':''}" onclick="activeTab='desc';renderTabs()">${t('description')}</button>
            <button class="tab-btn ${activeTab==='specs'?'active':''}" onclick="activeTab='specs';renderTabs()">${t('specifications')}</button>
            <button class="tab-btn ${activeTab==='reviews'?'active':''}" onclick="activeTab='reviews';renderTabs()">${t('reviews_label')} (${product.reviewCount.toLocaleString()})</button>
        </div>

        <!-- الوصف -->
        <div class="tab-content ${activeTab==='desc'?'active':''} fade-up">
            <p class="text-sm text-ink-700 leading-[1.9]">${desc}</p>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
                <div class="bg-surface-50 rounded-xl p-4 text-center"><i class="fas fa-truck text-brand-500 text-xl mb-2"></i><p class="text-xs font-bold text-ink-900">${t('free_ship')}</p></div>
                <div class="bg-surface-50 rounded-xl p-4 text-center"><i class="fas fa-undo-alt text-emerald-500 text-xl mb-2"></i><p class="text-xs font-bold text-ink-900">${t('return_policy')}</p></div>
                <div class="bg-surface-50 rounded-xl p-4 text-center"><i class="fas fa-shield-alt text-sky-500 text-xl mb-2"></i><p class="text-xs font-bold text-ink-900">${t('authentic')}</p></div>
                <div class="bg-surface-50 rounded-xl p-4 text-center"><i class="fas fa-certificate text-amber-500 text-xl mb-2"></i><p class="text-xs font-bold text-ink-900">${t('warranty')}</p></div>
            </div>
        </div>

        <!-- المواصفات -->
        <div class="tab-content ${activeTab==='specs'?'active':''} fade-up">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <tbody>${product.specs.map((s,i)=>`<tr class="${i%2===0?'bg-surface-50':''}"><td class="px-5 py-3.5 font-semibold text-ink-900 w-1/3 border-l-2 border-brand-500">${t(s.k)}</td><td class="px-5 py-3.5 text-ink-700">${t(s.v)}</td></tr>`).join('')}</tbody>
                </table>
            </div>
        </div>

        <!-- التقييمات -->
        <div class="tab-content ${activeTab==='reviews'?'active':''} fade-up">
            <!-- ملخص التقييم -->
            <div class="flex flex-col sm:flex-row gap-6 mb-8 p-5 bg-surface-50 rounded-2xl">
                <div class="text-center sm:text-right flex-shrink-0">
                    <div class="text-5xl font-extrabold text-ink-900">${product.rating}</div>
                    <div class="flex items-center justify-center sm:justify-start gap-1 mt-2">${rStars(product.rating)}</div>
                    <p class="text-xs text-ink-400 mt-1">${product.reviewCount.toLocaleString()} ${t('reviews_count')}</p>
                </div>
                <div class="flex-1 space-y-2">
                    ${product.ratingDist.map(d=>`<div class="flex items-center gap-3">
                        <span class="text-xs font-semibold text-ink-700 w-6 text-left">${d.stars}</span>
                        <i class="fas fa-star text-amber-400 text-[10px]"></i>
                        <div class="flex-1 h-2.5 bg-surface-200 rounded-full overflow-hidden"><div class="h-full bg-amber-400 rounded-full transition-all" style="width:${d.pct}%"></div></div>
                        <span class="text-xs font-semibold text-ink-500 w-10 text-left">${d.pct}%</span>
                    </div>`).join('')}
                </div>
            </div>
            <button class="btn-secondary btn-sm mb-6"><i class="fas fa-pen text-xs"></i>${t('write_review')}</button>

            <!-- المراجعات -->
            <div class="space-y-4">
                ${product.reviews.map(r=>{
                    const nm=lang==='en'?r.nameEn:r.name;
                    const txt=lang==='en'?r.text_en:r.text_ar;
                    const colors=['bg-brand-500','bg-emerald-500','bg-sky-500','bg-amber-500','bg-purple-500'];
                    const color=colors[r.id%colors.length];
                    return `<div class="review-card">
                        <div class="flex items-start gap-3 mb-3">
                            <div class="review-avatar ${color} text-white">${nm.charAt(0)}</div>
                            <div class="flex-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-sm font-bold text-ink-900">${nm}</span>
                                    ${r.verified?`<span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full"><i class="fas fa-check-circle text-[8px] ml-0.5"></i>${t('verified')}</span>`:''}
                                </div>
                                <div class="flex items-center gap-2 mt-1">${rStars(r.rating)}<span class="text-[10px] text-ink-400">${r.date}</span></div>
                            </div>
                        </div>
                        <p class="text-sm text-ink-700 leading-relaxed mb-3">${txt}</p>
                        <div class="flex items-center gap-4 text-xs text-ink-400">
                            <button class="flex items-center gap-1 hover:text-ink-700 transition-colors"><i class="far fa-thumbs-up"></i>${t('helpful')} (${r.helpful})</button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>
    </div>`;
}

// ========== منتجات مشابهة ==========
function renderSimilar(){
    document.getElementById('similarSection').innerHTML=`
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-extrabold text-ink-900">${t('similar')}</h2>
        <a href="#" class="text-sm font-semibold text-brand-500 hover:text-brand-600 transition-colors">${t('view_all')} <i class="fas fa-arrow-left text-xs mr-1"></i></a>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        ${similarProducts.map((p,i)=>{
            const nm=lang==='en'&&p.nameEn?p.nameEn:p.name;
            const disc=p.oldPrice?Math.round(((p.oldPrice-p.price)/p.oldPrice)*100):0;
            return `<div class="similar-card fade-up" style="animation-delay:${i*0.07}s">
                <div class="aspect-square bg-surface-100 overflow-hidden relative">
                    <img src="${p.img}" alt="${nm}" class="w-full h-full object-cover">
                    ${disc?`<span class="absolute top-2 left-2 bg-red-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-lg">-${disc}%</span>`:''}
                </div>
                <div class="p-3">
                    <span class="text-[9px] font-bold text-brand-500 bg-brand-50 px-1.5 py-0.5 rounded">${p.brand}</span>
                    <h4 class="text-xs font-semibold text-ink-900 mt-1.5 leading-relaxed line-clamp-2 min-h-[2rem]">${nm}</h4>
                    <div class="flex items-center gap-1 mt-1.5">${rStars(p.rating)}<span class="text-[9px] text-ink-400">${p.rating}</span></div>
                    <div class="flex items-end gap-1.5 mt-2">
                        <span class="text-sm font-extrabold text-ink-900">${p.price.toLocaleString()}</span>
                        ${p.oldPrice?`<span class="text-[10px] text-ink-300 line-through">${p.oldPrice.toLocaleString()}</span>`:''}
                    </div>
                </div>
            </div>`;
        }).join('')}
    </div>`;
}

// ========== أدوات ==========
function rStars(r){
    let s='';for(let i=1;i<=5;i++){
        if(i<=Math.floor(r))s+='<i class="fas fa-star star-fill text-xs"></i>';
        else if(i-r<1&&i-r>0)s+='<i class="fas fa-star-half-alt star-fill text-xs"></i>';
        else s+='<i class="fas fa-star star-empty text-xs"></i>';
    }return s;
}

// ========== لوحة الصور المكبّرة ==========
function openLightbox(){document.getElementById('lightboxImg').src=product.images[currentImg];document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();if(document.getElementById('lightbox').classList.contains('open')){if(e.key==='ArrowRight')changeImg(1);if(e.key==='ArrowLeft')changeImg(-1);}});

// ========== التوست ==========
function toast(msg,type){
    const box=document.getElementById('toastBox');
    const icons={success:'fa-check-circle text-emerald-500',error:'fa-times-circle text-red-500',info:'fa-info-circle text-sky-500'};
    const d=document.createElement('div');
    d.className='toast-in flex items-center gap-3 bg-white border border-surface-200 rounded-xl px-5 py-3.5 shadow-lg min-w-[260px] max-w-[380px]';
    d.innerHTML=`<i class="fas ${icons[type]||icons.info} text-lg flex-shrink-0"></i><p class="text-sm text-ink-900 flex-1 font-medium">${msg}</p><button onclick="this.parentElement.remove()" class="text-ink-300 hover:text-ink-500 flex-shrink-0"><i class="fas fa-times text-xs"></i></button>`;
    box.appendChild(d);
    setTimeout(()=>{d.classList.remove('toast-in');d.classList.add('toast-out');setTimeout(()=>d.remove(),300);},3000);
}

// ========== التهيئة ==========
renderAll();
</script>
