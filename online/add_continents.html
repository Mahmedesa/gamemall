<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - إدارة القارات</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{cairo:['Cairo','sans-serif']}}}}
</script>
<style>
:root{
  --bg:#06080e;--bg2:#0c0f17;--bg3:#12161f;
  --card:#151a25;--card2:#1a2030;--cardH:#202840;
  --bd:#1c2336;--bd2:#263050;--bd3:#334170;
  --acc:#f97316;--acc2:#ea580c;--accDk:#c2410c;
  --accGlow:rgba(249,115,22,.12);--accGlow2:rgba(249,115,22,.05);
  --red:#ef4444;--redGlow:rgba(239,68,68,.1);
  --green:#22c55e;--greenGlow:rgba(34,197,94,.1);
  --sky:#38bdf8;--skyGlow:rgba(56,189,248,.1);
  --violet:#a78bfa;--violetGlow:rgba(167,139,250,.1);
  --rose:#fb7185;--roseGlow:rgba(251,113,133,.1);
  --tx:#eef2f8;--tx2:#8896ab;--tx3:#4f5d75;
  --w:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 700px 500px at 10% 5%,rgba(249,115,22,.04),transparent),
             radial-gradient(ellipse 500px 600px at 90% 90%,rgba(167,139,250,.03),transparent),
             radial-gradient(ellipse 600px 400px at 50% 40%,rgba(56,189,248,.015),transparent)}

/* === الشريط العلوي === */
.topbar{background:rgba(12,15,23,.88);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;backdrop-filter:blur(18px)}
.topbar-in{max-width:1400px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;gap:16px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s;text-decoration:none;white-space:nowrap;flex-shrink:0}
.back-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--accGlow)}
.title-area{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.title-icon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0;box-shadow:0 4px 22px rgba(249,115,22,.3);position:relative;overflow:hidden}
.title-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 50%)}
.title-icon i{position:relative;z-index:1}
.title-txt h1{font-size:19px;font-weight:900;letter-spacing:-.3px;line-height:1.2}
.title-txt p{font-size:11px;color:var(--tx3);font-weight:500;margin-top:2px}
.top-acts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.lang-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .25s}
.lang-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--accGlow)}

/* === المحتوى === */
.content{max-width:1400px;margin:0 auto;padding:28px;position:relative;z-index:1}

/* === الإحصائيات === */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
@media(max-width:960px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.stats{grid-template-columns:1fr}}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 20px;position:relative;overflow:hidden;transition:all .3s}
.sc:hover{border-color:var(--bd2);transform:translateY(-2px);box-shadow:0 10px 32px rgba(0,0,0,.25)}
.sc::before{content:'';position:absolute;top:0;right:0;left:0;height:3px}
.sc.s1::before{background:var(--acc)}.sc.s2::before{background:var(--sky)}.sc.s3::before{background:var(--violet)}.sc.s4::before{background:var(--green)}
.sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sc-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sc-ico.i1{background:var(--accGlow);color:var(--acc)}.sc-ico.i2{background:var(--skyGlow);color:var(--sky)}.sc-ico.i3{background:var(--violetGlow);color:var(--violet)}.sc-ico.i4{background:var(--greenGlow);color:var(--green)}
.sc-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;background:rgba(79,93,117,.12);color:var(--tx3)}
.sc-val{font-size:32px;font-weight:900;line-height:1;margin-bottom:4px;letter-spacing:-.5px}
.sc-lbl{font-size:12px;color:var(--tx3);font-weight:600}

/* === شريط الأدوات === */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search-w{position:relative;flex:1;min-width:240px;max-width:420px}
.search-w input{width:100%;padding:11px 14px 11px 42px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;color:var(--tx);font-family:'Cairo',sans-serif;font-size:13px;outline:none;transition:all .25s}
.search-w input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accGlow)}
.search-w input::placeholder{color:var(--tx3)}
.search-w>i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:14px;pointer-events:none}
[dir="ltr"] .search-w input{padding:11px 42px 11px 14px}
[dir="ltr"] .search-w>i{left:auto;right:14px}
.add-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s;box-shadow:0 4px 18px rgba(249,115,22,.28);white-space:nowrap}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(249,115,22,.38)}
.add-btn:active{transform:scale(.97)}

/* === الجدول === */
.tbl-wrap{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.tbl-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--bd)}
.tbl-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.tbl-head h3 i{color:var(--acc)}
.tbl-cnt{font-size:12px;color:var(--tx3);font-weight:600;padding:3px 10px;background:var(--bg2);border-radius:8px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead{background:var(--bg2)}
th{padding:14px 18px;text-align:right;font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;border-bottom:1px solid var(--bd)}
[dir="ltr"] th{text-align:left}
td{padding:16px 18px;font-size:13px;font-weight:500;color:var(--tx2);border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--card2)}
.code-cell{display:inline-flex;align-items:center;justify-content:center;width:44px;height:32px;border-radius:8px;font-size:14px;font-weight:900;letter-spacing:1px;background:var(--accGlow);color:var(--acc);border:1px solid rgba(249,115,22,.15)}
.name-ar{color:var(--tx);font-weight:700}
.name-en{color:var(--tx2);font-size:12px;font-weight:500}
.area-val{color:var(--sky);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;display:inline-flex;align-items:center;gap:4px}
.pop-val{color:var(--violet);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;display:inline-flex;align-items:center;gap:4px}
.act-btns{display:flex;align-items:center;gap:6px}
.ab{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s}
.ab:hover{transform:scale(1.08)}
.ab.ae:hover{border-color:var(--sky);color:var(--sky);background:var(--skyGlow)}
.ab.ad:hover{border-color:var(--red);color:var(--red);background:var(--redGlow)}

/* === ترقيم الصفحات === */
.pg-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid var(--bd);flex-wrap:wrap;gap:12px}
.pg-info{font-size:12px;color:var(--tx3);font-weight:600}
.pg-btns{display:flex;align-items:center;gap:4px}
.pb{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;transition:all .2s}
.pb:hover{border-color:var(--bd2);color:var(--tx)}
.pb.act{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 12px rgba(249,115,22,.3)}
.pb:disabled{opacity:.3;cursor:not-allowed}

/* === المودال === */
.mov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.mov.on{display:flex;animation:mfI .2s ease}
.mbox{background:var(--card);border:1px solid var(--bd);border-radius:20px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:msI .3s ease}
@keyframes mfI{from{opacity:0}}@keyframes msI{from{opacity:0;transform:scale(.92)}}
.mh{padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px}
.mh h3{font-size:17px;font-weight:800;flex:1;display:flex;align-items:center;gap:10px}
.mh h3 i{color:var(--acc)}
.mx{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx3);transition:all .2s;font-size:15px;flex-shrink:0}
.mx:hover{background:var(--redGlow);border-color:var(--red);color:var(--red)}
.mb{padding:24px}
.fg{margin-bottom:18px}
.fg:last-child{margin-bottom:0}
.fl{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:7px}
.fl .rq{color:var(--red);font-size:14px}
.fi{width:100%;padding:11px 15px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:12px;color:var(--tx);font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:all .25s}
.fi:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accGlow)}
.fi::placeholder{color:var(--tx3)}
.fi.er{border-color:var(--red);box-shadow:0 0 0 3px var(--redGlow)}
.fe{font-size:11px;color:var(--red);font-weight:600;margin-top:5px;display:none}
.fe.sh{display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:540px){.frow{grid-template-columns:1fr}}
.mf{padding:16px 24px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.bt{padding:10px 22px;border-radius:12px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;transition:all .25s;outline:none}
.bt:active{transform:scale(.96)}
.bt-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 16px rgba(249,115,22,.25)}.bt-p:hover{box-shadow:0 6px 24px rgba(249,115,22,.35);transform:translateY(-1px)}
.bt-w{background:var(--bg2);color:var(--tx2);border:1px solid var(--bd)}.bt-w:hover{border-color:var(--bd2);color:var(--tx)}
.bt-d{background:var(--redGlow);color:var(--red);border:1px solid rgba(239,68,68,.2)}.bt-d:hover{background:rgba(239,68,68,.2)}

/* === تأكيد الحذف === */
.db{text-align:center;padding:36px 24px}
.db-ico{width:68px;height:68px;border-radius:50%;background:var(--redGlow);display:inline-flex;align-items:center;justify-content:center;font-size:30px;color:var(--red);margin-bottom:18px;animation:shk .4s ease}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.db-t{font-size:18px;font-weight:900;margin-bottom:8px}
.db-p{font-size:13px;color:var(--tx3);line-height:1.8;margin-bottom:6px}
.db-n{font-size:15px;font-weight:800;color:var(--acc);margin-bottom:24px;padding:8px 16px;background:var(--accGlow);border-radius:10px;display:inline-block}
.db-a{display:flex;gap:10px;justify-content:center}

/* === فارغ === */
.emp{text-align:center;padding:60px 20px;color:var(--tx3)}
.emp i{font-size:52px;margin-bottom:16px;opacity:.2;display:block}
.emp p{font-size:14px;font-weight:600}

/* === التوست === */
.tc{position:fixed;top:84px;left:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
[dir="ltr"] .tc{left:auto;right:24px}
.tt{padding:14px 20px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;animation:tI .35s ease;min-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.tt.ok{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.tt.er{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.tt.inf{background:rgba(56,189,248,.12);color:var(--sky);border:1px solid rgba(56,189,248,.2)}
.tt.wn{background:rgba(249,115,22,.12);color:var(--acc);border:1px solid rgba(249,115,22,.2)}
.tt.out{animation:tO .3s ease forwards}
@keyframes tI{from{opacity:0;transform:translateX(-30px)}}@keyframes tO{to{opacity:0;transform:translateX(-30px)}}

/* === حركات === */
.fu{opacity:0;transform:translateY(16px);animation:fU .5s ease forwards}
@keyframes fU{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}.d4{animation-delay:.16s}

::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--tx3)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="tc" id="toastC"></div>

<!-- مودال إضافة/تعديل -->
<div class="mov" id="formM">
<div class="mbox">
<div class="mh">
  <h3><i class="fas fa-earth-americas"></i> <span id="fTitle">إضافة قارة</span></h3>
  <button class="mx" onclick="closeM('formM')"><i class="fas fa-times"></i></button>
</div>
<div class="mb">
  <input type="hidden" id="eId">
  <div class="fg">
    <label class="fl" id="lCode">رمز القارة <span class="rq">*</span></label>
    <input type="text" id="fCode" class="fi" placeholder="مثال: AS" maxlength="2" style="text-transform:uppercase;width:120px">
    <span class="fe" id="eCode">رمز مكون من حرفين فريدة</span>
  </div>
  <div class="frow">
    <div class="fg">
      <label class="fl" id="lAr">اسم القارة بالعربية <span class="rq">*</span></label>
      <input type="text" id="fAr" class="fi" placeholder="مثال: آسيا">
      <span class="fe" id="eAr">هذا الحقل مطلوب</span>
    </div>
    <div class="fg">
      <label class="fl" id="lEn">اسم القارة بالإنجليزية <span class="rq">*</span></label>
      <input type="text" id="fEn" class="fi" placeholder="e.g. Asia">
      <span class="fe" id="eEn">This field is required</span>
    </div>
  </div>
  <div class="frow">
    <div class="fg">
      <label class="fl" id="lArea">المساحة (كم²)</label>
      <input type="text" id="fArea" class="fi" placeholder="مثال: 44579000" style="direction:ltr;text-align:right">
    </div>
    <div class="fg">
      <label class="fl" id="lPop">عدد السكان</label>
      <input type="text" id="fPop" class="fi" placeholder="مثال: 4750000000" style="direction:ltr;text-align:right">
    </div>
  </div>
</div>
<div class="mf">
  <button class="bt bt-p" onclick="saveRec()"><i class="fas fa-save"></i> <span id="sBtn">حفظ</span></button>
  <button class="bt bt-w" onclick="closeM('formM')"><span id="cBtn">إلغاء</span></button>
</div>
</div>
</div>

<!-- مودال تأكيد الحذف -->
<div class="mov" id="delM">
<div class="mbox" style="max-width:460px">
<div class="db">
  <div class="db-ico"><i class="fas fa-trash-can"></i></div>
  <h3 class="db-t" id="dT">تأكيد الحذف</h3>
  <p class="db-p" id="dP">سيتم حذف القارة التالية نهائياً:</p>
  <div class="db-n" id="dN"></div>
  <div class="db-a">
    <button class="bt bt-d" id="dConf"><i class="fas fa-trash"></i> <span id="dBT">حذف نهائياً</span></button>
    <button class="bt bt-w" onclick="closeM('delM')"><span id="dCB">إلغاء</span></button>
  </div>
</div>
</div>
</div>

<!-- الشريط العلوي -->
<header class="topbar">
<div class="topbar-in">
  <a href="#" class="back-btn" onclick="event.preventDefault();toast('Dashboard','inf')">
    <i class="fas fa-arrow-right"></i>
    <span id="bBtn">الرجوع للوحة التحكم</span>
  </a>
  <div class="title-area">
    <div class="title-icon"><i class="fas fa-earth-americas"></i></div>
    <div class="title-txt">
      <h1 id="pT">إدارة القارات</h1>
      <p id="pS">إضافة وتعديل وحذف بيانات القارات</p>
    </div>
  </div>
  <div class="top-acts">
    <button class="lang-btn" onclick="toggleLang()">
      <i class="fas fa-globe"></i>
      <span id="lBtn">English</span>
    </button>
  </div>
</div>
</header>

<!-- المحتوى -->
<main class="content">
  <div class="stats" id="statsA"></div>
  <div class="toolbar fu d2">
    <div class="search-w">
      <i class="fas fa-search"></i>
      <input type="text" id="sIn" placeholder="ابحث عن قارة..." oninput="onSrc()">
    </div>
    <button class="add-btn" onclick="openAdd()">
      <i class="fas fa-plus"></i>
      <span id="aBtn">إضافة قارة</span>
    </button>
  </div>
  <div class="tbl-wrap fu d3">
    <div class="tbl-head">
      <h3><i class="fas fa-table-list"></i> <span id="tT">قائمة القارات</span></h3>
      <span class="tbl-cnt" id="tC">0</span>
    </div>
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:50px">#</th>
            <th id="hCode" style="width:90px">الرمز</th>
            <th id="hName">اسم القارة</th>
            <th id="hArea">المساحة (كم²)</th>
            <th id="hPop">عدد السكان</th>
            <th id="hAct" style="width:110px">الإجراءات</th>
          </tr>
        </thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
    <div class="emp" id="empS" style="display:none">
      <i class="fas fa-inbox"></i>
      <p id="empT">لا توجد قارات مطابقة</p>
    </div>
    <div class="pg-bar" id="pgBar"></div>
  </div>
</main>

<script>
/* ===== البيانات ===== */
var data=[
  {id:1,code:'AS',name_ar:'آسيا',name_en:'Asia',area:44579000,pop:4750000000},
  {id:2,code:'AF',name_ar:'أفريقيا',name_en:'Africa',area:30370000,pop:1430000000},
  {id:3,code:'EU',name_ar:'أوروبا',name_en:'Europe',area:10180000,pop:748000000},
  {id:4,code:'NA',name_ar:'أمريكا الشمالية',name_en:'North America',area:24709000,pop:579000000},
  {id:5,code:'SA',name_ar:'أمريكا الجنوبية',name_en:'South America',area:17840000,pop:434000000},
  {id:6,code:'OC',name_ar:'أوقيانوسيا',name_en:'Oceania',area:8525989,pop:45000000},
  {id:7,code:'AN',name_ar:'أنتاركتيكا',name_en:'Antarctica',area:14200000,pop:0}
];

function lt(k){return T[k]?T[k][lang]:k}

/* ===== التوست ===== */
function toast(m,t){
  var ic={ok:'fa-circle-check',er:'fa-circle-xmark',inf:'fa-circle-info',wn:'fa-triangle-exclamation'};
  var c=document.getElementById('toastC');
  var d=document.createElement('div');d.className='tt '+t;
  d.innerHTML='<i class="fas '+(ic[t]||ic.inf)+'"></i><span>'+m+'</span>';
  c.appendChild(d);setTimeout(function(){d.classList.add('out');setTimeout(function(){d.remove()},300)},3000);
}

/* ===== المودالات ===== */
function openM(id){document.getElementById(id).classList.add('on')}
function closeM(id){document.getElementById(id).classList.remove('on')}

/* ===== تنسيق الأرقام ===== */
function fmtNum(n){
  if(n===null||n===undefined||n==='')return lang==='ar'?'—':'—';
  var num=parseInt(n);
  if(isNaN(num))return n;
  return num.toLocaleString(lang==='ar'?'ar-SA':'en-US');
}
function fmtArea(n){
  if(n===null||n===undefined||n==='')return '—';
  var num=parseInt(n);
  if(isNaN(num))return n;
  return num.toLocaleString(lang==='ar'?'ar-SA':'en-US')+' '+lt('km2');
}
function fmtPop(n){
  if(n===null||n===undefined||n==='')return '—';
  var num=parseInt(n);
  if(isNaN(num))return n;
  if(num>=1000000000)return (num/1000000000).toFixed(1)+'B';
  if(num>=1000000)return (num/1000000).toFixed(0)+'M';
  if(num>=1000)return (num/1000).toFixed(0)+'K';
  return num.toLocaleString(lang==='ar'?'ar-SA':'en-US');
}

/* ===== الترجمة ===== */
function toggleLang(){
  lang=lang==='ar'?'en':'ar';
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  applyL();renderAll();
}

/* ===== البحث ===== */
function getFiltered(){
  var q=document.getElementById('sIn').value.trim().toLowerCase();
  return data.filter(function(c){
    return !q||c.name_ar.toLowerCase().indexOf(q)!==-1||c.name_en.toLowerCase().indexOf(q)!==-1||c.code.toLowerCase().indexOf(q)!==-1;
  });
}
function onSrc(){curPage=1;renderTable();renderStats()}

/* ===== الإحصائيات ===== */
function renderStats(){
  var f=getFiltered();
  var tArea=0,tPop=0;
  f.forEach(function(c){tArea+=(parseInt(c.area)||0);tPop+=(parseInt(c.pop)||0)});
  var avgP=f.length?(tPop/f.length):0;
  document.getElementById('statsA').innerHTML=
    '<div class="sc s1 fu d1"><div class="sc-top"><div class="sc-ico i1"><i class="fas fa-earth-americas"></i></div><span class="sc-tag">'+lt('total')+'</span></div><div class="sc-val">'+f.length+'</div><div class="sc-lbl">'+lt('totalC')+'</div></div>'+
    '<div class="sc s2 fu d2"><div class="sc-top"><div class="sc-ico i2"><i class="fas fa-expand"></i></div><span class="sc-tag">'+lt('km2')+'</span></div><div class="sc-val">'+fmtArea(tArea)+'</div><div class="sc-lbl">'+lt('totalArea')+'</div></div>'+
    '<div class="sc s3 fu d3"><div class="sc-top"><div class="sc-ico i3"><i class="fas fa-users"></i></div><span class="sc-tag">'+lt('total')+'</span></div><div class="sc-val">'+fmtPop(tPop)+'</div><div class="sc-lbl">'+lt('totalPop')+'</div></div>'+
    '<div class="sc s4 fu d4"><div class="sc-top"><div class="sc-ico i4"><i class="fas fa-chart-line"></i></div><span class="sc-tag">'+lt('total')+'</span></div><div class="sc-val">'+fmtPop(avgP)+'</div><div class="sc-lbl">'+lt('avgPop')+'</div></div>';
}

/* ===== الجدول ===== */
function renderTable(){
  var f=getFiltered();
  var tp=Math.max(1,Math.ceil(f.length/perPage));
  if(curPage>tp)curPage=tp;
  var s=(curPage-1)*perPage;
  var items=f.slice(s,s+perPage);

  document.getElementById('tC').textContent=f.length+' '+lt('contW');
  var tb=document.getElementById('tBody');
  var emp=document.getElementById('empS');

  if(!f.length){tb.innerHTML='';emp.style.display='';document.getElementById('pgBar').innerHTML='';return}
  emp.style.display='none';

  tb.innerHTML=items.map(function(c,i){
    return '<tr>'+
      '<td style="color:var(--tx3);font-weight:700">'+(s+i+1)+'</td>'+
      '<td><span class="code-cell">'+c.code.toUpperCase()+'</span></td>'+
      '<td><div class="name-ar">'+(lang==='ar'?c.name_ar:c.name_en)+'</div><div class="name-en">'+(lang==='ar'?c.name_en:c.name_ar)+'</div></td>'+
      '<td><span class="area-val"><i class="fas fa-expand" style="font-size:10px;opacity:.5"></i> '+fmtNum(c.area)+'</span></td>'+
      '<td><span class="pop-val"><i class="fas fa-users" style="font-size:10px;opacity:.5"></i> '+fmtPop(c.pop)+'</span></td>'+
      '<td><div class="act-btns">'+
        '<button class="ab ae" title="'+lt('eTip')+'" onclick="openEdt('+c.id+')"><i class="fas fa-pen-to-square"></i></button>'+
        '<button class="ab ad" title="'+lt('dTip')+'" onclick="openDel('+c.id+')"><i class="fas fa-trash-can"></i></button>'+
      '</div></td>'+
    '</tr>';
  }).join('');

  /* ترقيم الصفحات */
  if(tp<=1){document.getElementById('pgBar').innerHTML='<span class="pg-info">'+lt('show')+' '+f.length+' '+lt('contW')+'</span>';return}
  var startR=s+1,endR=Math.min(s+perPage,f.length);
  var h='<span class="pg-info">'+lt('show')+' '+startR+' - '+endR+' '+lt('of')+' '+f.length+'</span><div class="pg-btns">';
  h+='<button class="pb" '+(curPage<=1?'disabled':'')+' onclick="goP('+(curPage-1)+')"><i class="fas fa-chevron-right"></i></button>';
  for(var p=1;p<=tp;p++){h+='<button class="pb'+(p===curPage?' act':'')+'" onclick="goP('+p+')">'+p+'</button>'}
  h+='<button class="pb" '+(curPage>=tp?'disabled':'')+' onclick="goP('+(curPage+1)+')"><i class="fas fa-chevron-left"></i></button></div>';
  document.getElementById('pgBar').innerHTML=h;
}
function goP(p){curPage=p;renderTable();document.querySelector('.tbl-scroll').scrollTop=0}

/* ===== إضافة ===== */
function openAdd(){
  document.getElementById('eId').value='';
  document.getElementById('fCode').value='';
  document.getElementById('fCode').disabled=false;
  document.getElementById('fAr').value='';
  document.getElementById('fEn').value='';
  document.getElementById('fArea').value='';
  document.getElementById('fPop').value='';
  clrErr();
  document.getElementById('fTitle').textContent=lt('addT');
  openM('formM');
  setTimeout(function(){document.getElementById('fCode').focus()},200);
}

/* ===== تعديل ===== */
function openEdt(id){
  var c=data.find(function(x){return x.id===id});if(!c)return;
  document.getElementById('eId').value=id;
  document.getElementById('fCode').value=c.code;
  document.getElementById('fCode').disabled=true;
  document.getElementById('fAr').value=c.name_ar;
  document.getElementById('fEn').value=c.name_en;
  document.getElementById('fArea').value=c.area||'';
  document.getElementById('fPop').value=c.pop||'';
  clrErr();
  document.getElementById('fTitle').textContent=lt('edtT');
  openM('formM');
}

/* ===== حفظ ===== */
function saveRec(){
  clrErr();
  var code=document.getElementById('fCode').value.trim().toUpperCase();
  var ar=document.getElementById('fAr').value.trim();
  var en=document.getElementById('fEn').value.trim();
  var area=document.getElementById('fArea').value.trim();
  var pop=document.getElementById('fPop').value.trim();
  var ok=true;

  if(!code||code.length!==2){document.getElementById('fCode').classList.add('er');document.getElementById('eCode').classList.add('sh');ok=false}
  if(!ar){document.getElementById('fAr').classList.add('er');document.getElementById('eAr').classList.add('sh');ok=false}
  if(!en){document.getElementById('fEn').classList.add('er');document.getElementById('eEn').classList.add('sh');ok=false}

  /* فحص تكرار الرمز */
  var eid=document.getElementById('eId').value;
  if(ok&&code){
    var dup=data.find(function(c){return c.code.toUpperCase()===code&&c.id!==+eid});
    if(dup){document.getElementById('fCode').classList.add('er');document.getElementById('eCode').textContent=lt('tDup');document.getElementById('eCode').classList.add('sh');toast(lt('tDup'),'wn');ok=false}
  }
  if(!ok&&!document.getElementById('eCode').classList.contains('sh')){toast(lt('tErr'),'er');return}
  if(!ok)return;

  var obj={
    code:code,
    name_ar:ar,name_en:en,
    area:area?parseInt(area.replace(/,/g,'')):null,
    pop:pop?parseInt(pop.replace(/,/g,'')):null
  };

  if(eid){
    var c=data.find(function(x){return x.id===+eid});
    if(c){Object.assign(c,obj)}
    toast(lt('tUpd'),'ok');
  }else{
    obj.id=nxId++;
    data.unshift(obj);
    toast(lt('tAdded'),'ok');
  }
  closeM('formM');renderAll();
}
function clrErr(){
  document.querySelectorAll('.fi').forEach(function(el){el.classList.remove('er')});
  document.querySelectorAll('.fe').forEach(function(el){el.classList.remove('sh')});
  /* إعادة نص الخطأ الافتراضي */
  document.getElementById('eCode').textContent=lt('eCode');
  document.getElementById('eAr').textContent=lt('eAr');
  document.getElementById('eEn').textContent=lt('eEn');
}

/* ===== حذف ===== */
function openDel(id){
  delId=id;
  var c=data.find(function(x){return x.id===id});if(!c)return;
  document.getElementById('dN').textContent=(lang==='ar'?c.name_ar:c.name_en)+' ('+c.code.toUpperCase()+')';
  openM('delM');
}
document.getElementById('dConf').addEventListener('click',function(){
  if(delId!==null){
    data=data.filter(function(c){return c.id!==delId});
    delId=null;closeM('delM');
    toast(lt('tDel'),'er');renderAll();
  }
});

/* ===== رسم الكل ===== */
function renderAll(){renderStats();renderTable()}

/* ===== إغلاق المودال بالنقر على الخلفية ===== */
document.querySelectorAll('.mov').forEach(function(m){
  m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('on')});
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')document.querySelectorAll('.mov.on').forEach(function(m){m.classList.remove('on')});
});

/* ===== تشغيل ===== */
applyL();renderAll();
</script>
