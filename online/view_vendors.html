<style>
:root{--bg:#0b0d13;--bg2:#111420;--card:#161a28;--card2:#1c2033;--border:#252a3a;--accent:#10b981;--accent2:#34d399;--accent-bg:rgba(16,185,129,.08);--text:#e2e8f0;--text2:#8b95aa;--danger:#ef4444;--warn:#f59e0b;--info:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sidebar{width:260px;min-height:100vh;background:var(--bg2);border-left:1px solid var(--border);position:fixed;right:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s;border-right:3px solid transparent;position:relative;overflow:hidden}
.sidebar-link:hover,.sidebar-link.active{color:var(--accent);background:var(--accent-bg);border-right-color:var(--accent)}
.sidebar-link i{width:20px;text-align:center;font-size:14px}
.main{margin-right:260px;min-height:100vh;padding:0}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:all .3s;animation:fadeUp .4s ease both}
.section-card:hover{border-color:rgba(16,185,129,.2);box-shadow:0 0 30px rgba(16,185,129,.03)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:17px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.section-title i{font-size:16px}
.field{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(37,42,58,.5)}
.field-label{min-width:180px;font-size:12px;color:var(--text2);padding-top:2px;font-weight:600}
.field-value{font-size:13px;color:var(--text);font-weight:500;flex:1;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(16,185,129,.12);color:#34d399}
.badge-red{background:rgba(239,68,68,.12);color:#f87171}
.badge-yellow{background:rgba(245,158,11,.12);color:#fbbf24}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Cairo'}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:5px 10px;font-size:11px}
.input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Cairo';width:100%;transition:border-color .2s}
.input:focus{outline:none;border-color:var(--accent)}
.select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Cairo');width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start}
.img-thumb{width:120px;height:90px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid var(--border);transition:all .2s}
.img-thumb:hover{border-color:var(--accent);transform:scale(1.05)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 0 60px rgba(0,0,0,.5)}
.social-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:transform .2s;cursor:pointer}
.social-icon:hover{transform:scale(1.15)}
.toast{position:fixed;bottom:24px;left:24px;background:var(--card2);border:1px solid var(--accent);color:var(--accent);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;animation:toastIn .3s ease;display:none}
.toast.show{display:block}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.table-view table{width:100%;border-collapse:collapse}
.table-view th{background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.table-view td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text)}
.table-view tr:hover td{background:var(--accent-bg)}
.supplier-selector{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px;font-family:'Cairo';min-width:200px}
.glow-line{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px 0;opacity:.3}
.logo-container{width:80px;height:80px;border-radius:12px;border:2px solid var(--border);overflow:hidden;flex-shrink:0}
.logo-container img{width:100%;height:100%;object-fit:cover}
@media(max-width:768px){.sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.field{flex-direction:column;gap:2px}.field-label{min-width:auto}}
@media print{
  body{background:#fff!important;color:#000!important;font-size:11px}
  .sidebar,.topbar,.no-print{display:none!important}
  .main{margin:0!important;padding:10px!important}
  .section-card{break-inside:avoid;background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important;animation:none!important}
  .section-title{color:#000!important;border-bottom:2px solid #333!important}
  .field-label{color:#555!important}
  .field-value{color:#000!important}
  .badge{border:1px solid #999!important;background:#fff!important;color:#000!important}
  .print-header{display:block!important;text-align:center;margin-bottom:20px;padding-bottom:10px;border-bottom:3px double #000}
}
.print-header{display:none}
.bg-pattern{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;background-image:radial-gradient(circle at 25% 25%,var(--accent) 1px,transparent 1px),radial-gradient(circle at 75% 75%,var(--accent) 1px,transparent 1px);background-size:60px 60px}
</style>
</head>

function t(key){ return T[state.lang][key] || key; }
function fmtNum(n){ return Number(n).toLocaleString(state.lang==='ar'?'ar-SA':'en-US'); }

function renderSidebar(){
  const s = suppliers[state.current];
  document.getElementById('sidebar').innerHTML = `
    <div style="padding:20px 18px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <img src="${s.logo}" style="width:36px;height:36px;border-radius:8px;object-fit:cover" alt="">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--text)">${s.tradeName}</div>
          <div style="font-size:10px;color:var(--text2)">${s.username}</div>
        </div>
      </div>
    </div>
    <div style="padding:10px 0">
      ${navItems.map((n,i)=>`
        <div class="sidebar-link ${state.editSection===null&&i===0?'active':''}" onclick="scrollToSection('${n.key}',this)">

}

  document.getElementById('topbar').innerHTML = `

    </button>
    <button class="btn btn-outline btn-sm" onclick="alert(t('dashboard'))">
      <i class="fas fa-arrow-right"></i> ${t('dashboard')}
    </button>
    <div style="flex:1;max-width:320px;margin:0 auto;position:relative">
      <i class="fas fa-search" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:12px"></i>
      <input class="input" style="padding-right:34px;font-size:12px" placeholder="${t('search')}" value="${state.search}" oninput="handleSearch(this.value)">
    </div>
    <select class="supplier-selector" onchange="switchSupplier(this.value)">
      ${suppliers.map((s,i)=>`<option value="${i}" ${i===state.current?'selected':''}>${s.tradeName}</option>`).join('')}
    </select>
    <div style="display:flex;gap:6px">
      <button class="btn btn-outline btn-sm" onclick="toggleLang()" title="${t('translate')}">
        <i class="fas fa-globe"></i> ${state.lang==='ar'?'EN':'AR'}
      </button>
      <button class="btn btn-outline btn-sm" onclick="toggleView()" title="${t('changeView')}">
        <i class="fas ${state.view==='cards'?'fa-table':'fa-th-large'}"></i>
      </button>
      <button class="btn btn-outline btn-sm" onclick="showPrintOptions()" title="${t('print')}">
        <i class="fas fa-print"></i>
      </button>
    </div>
  `;
  // زر القائمة للشاشات الصغيرة
  const mq = window.matchMedia('(max-width:768px)');
  document.getElementById('menuBtn').style.display = mq.matches?'inline-flex':'none';
}

function renderContent(){
  const filtered = suppliers.filter(s=>{
    if(!state.search) return true;
    const q = state.search.toLowerCase();
    return s.companyName.toLowerCase().includes(q)||s.tradeName.toLowerCase().includes(q)||s.ownerName.toLowerCase().includes(q)||s.username.toLowerCase().includes(q);
  });
  if(state.view==='table'){
    renderTableView(filtered);
  } else {
    if(filtered.length===0){
      document.getElementById('contentArea').innerHTML = `<div style="text-align:center;padding:60px;color:var(--text2)"><i class="fas fa-search" style="font-size:40px;margin-bottom:16px;display:block;opacity:.3"></i>${t('noResults')}</div>`;
      return;
    }
    if(state.search && filtered.length>0 && !filtered.find((s,i)=>i===state.current)){
      state.current = suppliers.indexOf(filtered[0]);
      document.querySelector('.supplier-selector').value = state.current;
    }
    renderCardView(suppliers[state.current]);
  }
}

function renderCardView(s){
  document.getElementById('contentArea').innerHTML = `
    <div class="print-header">
      <h1 style="font-size:22px;font-weight:900">${s.companyName}</h1>
      <p style="font-size:13px;color:#666">${s.tradeName} - ${t('supplierPanel')}</p>
    </div>
    ${renderLoginSection(s)}
    ${renderBasicSection(s)}
    ${renderContactSection(s)}
    ${renderAddressSection(s)}
    ${renderLegalSection(s)}
    ${renderAttachmentsSection(s)}
    ${renderBankSection(s)}
    ${renderTaxSection(s)}
    ${renderShippingSection(s)}
    ${renderPaymentSection(s)}
  `;
  // تحديث القائمة الجانبية النشطة
  document.querySelectorAll('.sidebar-link').forEach((el,i)=>el.classList.remove('active'));
}

function saveEdit(){
  const s = suppliers[state.current];
  const section = state.editSection;
  const v = id => { const el = document.getElementById(id); return el?el.value:''; };

  if(section==='loginInfo'){
    s.password = v('edit-password');
    s.email = v('edit-email');
    s.securityQuestion = v('edit-secQ');
    s.securityAnswer = v('edit-secA');
  } else if(section==='basicData'){
    s.companyName = v('edit-companyName');
    s.tradeName = v('edit-tradeName');
    s.ownerName = v('edit-ownerName');
    s.activityType = v('edit-activityType');
    s.foundingYear = parseInt(v('edit-foundingYear'))||s.foundingYear;
    s.employeesCount = parseInt(v('edit-employeesCount'))||s.employeesCount;
    s.capital = parseInt(v('edit-capital'))||s.capital;
    s.overview = v('edit-overview');
  } else if(section==='contactInfo'){
    s.contactPerson = v('edit-contactPerson');
    s.contactPosition = v('edit-contactPosition');
    s.phone = v('edit-phone');
    s.altPhone = v('edit-altPhone');
    s.contactEmail = v('edit-contactEmail');
    s.website = v('edit-website');
  } else if(section==='addresses'){
    s.address = v('edit-address');
    s.area = v('edit-area');
    s.governorate = v('edit-governorate');
    s.warehouseAddress = v('edit-warehouseAddr');
    s.returnAddress = v('edit-returnAddr');
  } else if(section==='legalData'){
    s.commercialReg = v('edit-commercialReg');
    s.commercialRegIssue = v('edit-regIssue');
    s.commercialRegExpiry = v('edit-regExpiry');
    s.taxCard = v('edit-taxCard');
    s.taxRegistration = v('edit-taxReg');
    s.activityLicense = v('edit-activityLicense');
    s.commercialChamber = v('edit-commercialChamber');
    s.legalStatus = v('edit-legalStatus');
  } else if(section==='bankAccount'){
    s.bank.itemName = v('edit-itemName');
    s.bank.accountHolder = v('edit-accountHolder');
    s.bank.accountNumber = v('edit-accountNumber');
    s.bank.iban = v('edit-iban');
    s.bank.swiftCode = v('edit-swiftCode');
    s.bank.currency = v('edit-currency');
    s.bank.bankCountry = v('edit-bankCountry');
  } else if(section==='taxInfo'){
    s.tax.isRegistered = v('edit-isRegistered')==='true';
    s.tax.taxNumber = v('edit-taxNumber');
    s.tax.taxRate = parseFloat(v('edit-taxRate'))||s.tax.taxRate;
    s.tax.taxType = v('edit-taxType');
    s.tax.taxCountry = v('edit-taxCountry');
  } else if(section==='shippingInfo'){
    s.shipping.company = v('edit-shipCompany');
    s.shipping.method = v('edit-shipMethod');
    s.shipping.deliveryAreas = v('edit-deliveryAreas');
    s.shipping.deliveryTime = v('edit-deliveryTime');
    s.shipping.shippingCost = v('edit-shippingCost');
    s.shipping.internationalShipping = v('edit-intlShipping')==='true';
  } else if(section==='paymentMethods'){
    const checked = [...document.querySelectorAll('.pay-method-cb:checked')].map(c=>c.value);
    s.payment.methods = checked.length?checked:s.payment.methods;
    s.payment.deliveryTime = v('edit-payDelTime');
    s.payment.minInvoice = parseInt(v('edit-minInvoice'))||s.payment.minInvoice;
    s.payment.commissionRate = parseFloat(v('edit-commRate'))||s.payment.commissionRate;
    s.payment.currency = v('edit-payCurrency');
  }

  closeModal();
  renderAll();
  showToast(state.lang==='ar'?'تم حفظ التغييرات بنجاح':'Changes saved successfully');
}

function closeModal(){
  document.getElementById('editModal').classList.remove('show');
  state.editSection = null;
}

// ============ عارض الصور ============
function openLightbox(src){
  document.getElementById('lightboxImg').src = src;

// ============ الإشعارات ============
function showToast(msg){
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="fas fa-check-circle" style="margin-left:8px"></i>${msg}`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ============ التنقل ============
function scrollToSection(key, el){
  const target = document.getElementById('sec-'+key);
  if(target){
    target.scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
    if(el) el.classList.add('active');
  }
}

  state.lang = state.lang==='ar'?'en':'ar';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar'?'rtl':'ltr';
  if(state.lang==='en'){
    document.querySelector('.sidebar').style.cssText += 'right:auto;left:0;border-left:none;border-right:1px solid var(--border)';
    document.querySelector('.main').style.marginRight = '0';
    document.querySelector('.main').style.marginLeft = '260px';
    document.querySelectorAll('.sidebar-link').forEach(l=>{l.style.borderRight='none';l.style.borderLeft='3px solid transparent'});
    document.querySelectorAll('.sidebar-link:hover,.sidebar-link.active').forEach(l=>{l.style.borderLeftColor='var(--accent)'});
  } else {
    document.querySelector('.sidebar').style.cssText = '';
    document.querySelector('.main').style.marginRight = '260px';
    document.querySelector('.main').style.marginLeft = '0';
  }
  renderAll();
}

// ============ التهيئة ============
function renderAll(){
  renderSidebar();
  renderTopbar();
  renderContent();
}

// التمرير التلقائي لتحديث القائمة الجانبية
const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const id = entry.target.id.replace('sec-','');
      document.querySelectorAll('.sidebar-link').forEach(l=>{
        l.classList.toggle('active', l.getAttribute('onclick')?.includes(id));
      });
    }
  });
},{threshold:0.3,rootMargin:'-80px 0px -50% 0px'});

function observeSections(){
  document.querySelectorAll('[id^="sec-"]').forEach(el=>observer.observe(el));
}

// الاستجابة لحجم الشاشة
window.matchMedia('(max-width:768px)').addEventListener('change',e=>{
  const btn = document.getElementById('menuBtn');
  if(btn) btn.style.display = e.matches?'inline-flex':'none';
});

// إغلاق القائمة الجانبية عند النقر خارجها على الموبايل
document.addEventListener('click',e=>{
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('menuBtn');
  if(window.innerWidth<=768 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !btn.contains(e.target)){
    sidebar.classList.remove('open');
  }
});

// البدء
renderAll();
setTimeout(observeSections,100);
</script>
