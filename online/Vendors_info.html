<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d13;--bg2:#111420;--card:#161a28;--card2:#1c2033;--border:#252a3a;--accent:#10b981;--accent2:#34d399;--accent-bg:rgba(16,185,129,.08);--text:#e2e8f0;--text2:#8b95aa;--danger:#ef4444;--warn:#f59e0b;--info:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* بطاقة الشركة في القائمة */
.company-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);position:relative}
.company-card::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .3s}
.company-card:hover{border-color:rgba(16,185,129,.35);transform:translateY(-6px);box-shadow:0 20px 50px rgba(16,185,129,.08)}
.company-card:hover::before{opacity:1}
.company-card .card-top{height:100px;position:relative;overflow:hidden}
.company-card .card-top img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.company-card:hover .card-top img{transform:scale(1.08)}
.company-card .card-top::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--card) 100%)}
.company-card .card-logo{width:64px;height:64px;border-radius:14px;border:3px solid var(--card);position:relative;margin:-36px auto 0;z-index:2;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.company-card .card-logo img{width:100%;height:100%;object-fit:cover}
.company-card .card-body{padding:14px 20px 20px;text-align:center}
.company-card .card-name{font-size:15px;font-weight:800;margin-bottom:2px;line-height:1.4}
.company-card .card-trade{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:12px}
.company-card .card-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.company-card .card-stat{background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center}
.company-card .card-stat-val{font-size:13px;font-weight:800;color:var(--text)}
.company-card .card-stat-label{font-size:9px;color:var(--text2);margin-top:2px}
.company-card .card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.company-card .card-btn{color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;transition:gap .2s}
.company-card:hover .card-btn{gap:8px}

/* الشريط الجانبي */
.sidebar{width:260px;min-height:100vh;background:var(--bg2);border-left:1px solid var(--border);position:fixed;right:0;top:0;z-index:40;transition:transform .3s}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s;border-right:3px solid transparent}
.sidebar-link:hover,.sidebar-link.active{color:var(--accent);background:var(--accent-bg);border-right-color:var(--accent)}
.sidebar-link i{width:20px;text-align:center;font-size:14px}
.main{min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}
.detail-main{margin-right:260px}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:all .3s;animation:fadeUp .4s ease both}
.section-card:hover{border-color:rgba(16,185,129,.2);box-shadow:0 0 30px rgba(16,185,129,.03)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.section-title{font-size:17px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.field{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(37,42,58,.5)}
.field-label{min-width:180px;font-size:12px;color:var(--text2);padding-top:2px;font-weight:600}
.field-value{font-size:13px;color:var(--text);font-weight:500;flex:1;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(16,185,129,.12);color:#34d399}
.badge-red{background:rgba(239,68,68,.12);color:#f87171}
.badge-yellow{background:rgba(245,158,11,.12);color:#fbbf24}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Cairo'}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-back{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);padding:8px 16px}.btn-back:hover{border-color:var(--accent);color:var(--accent)}
.input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Cairo';width:100%;transition:border-color .2s}
.input:focus{outline:none;border-color:var(--accent)}
.select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Cairo';width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start}
.img-thumb{width:100%;height:100px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid var(--border);transition:all .2s}
.img-thumb:hover{border-color:var(--accent);transform:scale(1.05)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px}
.social-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:transform .2s;cursor:pointer;text-decoration:none}
.social-icon:hover{transform:scale(1.15)}
.toast{position:fixed;bottom:24px;left:24px;background:var(--card2);border:1px solid var(--accent);color:var(--accent);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;animation:toastIn .3s ease;display:none}
.toast.show{display:block}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.table-view table{width:100%;border-collapse:collapse}
.table-view th{background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.table-view td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text)}
.table-view tr:hover td{background:var(--accent-bg)}
.supplier-selector{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px;font-family:'Cairo';min-width:200px}
.logo-container{width:80px;height:80px;border-radius:12px;border:2px solid var(--border);overflow:hidden;flex-shrink:0}
.logo-container img{width:100%;height:100%;object-fit:cover}
.search-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 44px 10px 16px;font-size:14px;font-family:'Cairo';color:var(--text);width:100%;max-width:480px;transition:all .3s}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.stat-pill{display:inline-flex;align-items:center;gap:4px;background:var(--bg);padding:4px 10px;border-radius:20px;font-size:10px;color:var(--text2);border:1px solid var(--border)}
.bg-pattern{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;background-image:radial-gradient(circle at 25% 25%,var(--accent) 1px,transparent 1px),radial-gradient(circle at 75% 75%,var(--accent) 1px,transparent 1px);background-size:60px 60px}
.glow-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.06}

@media(max-width:768px){
  .sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}
  .detail-main{margin-right:0!important;margin-left:0!important}
  .field{flex-direction:column;gap:2px}.field-label{min-width:auto}
  .company-card .card-stats{grid-template-columns:1fr}
}
@media print{
  body{background:#fff!important;color:#000!important;font-size:11px}
  .sidebar,.topbar,.no-print,.glow-orb,.bg-pattern{display:none!important}
  .main,.detail-main{margin:0!important;padding:10px!important}
  .section-card{break-inside:avoid;background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important;animation:none!important}
  .section-title{color:#000!important;border-bottom:2px solid #333!important}
  .field-label{color:#555!important}.field-value{color:#000!important}
  .badge{border:1px solid #999!important;background:#fff!important;color:#000!important}
  .print-header{display:block!important;text-align:center;margin-bottom:20px;padding-bottom:10px;border-bottom:3px double #000}
}
.print-header{display:none}
</style>
</head>

    </div>
  </div>
</div>

<!-- عارض الصور -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <img id="lightboxImg" src="" alt="">
</div>

<!-- إشعار -->
<div class="toast" id="toast"></div>

// ============ الشاشة الرئيسية - قائمة الشركات ============
function renderListPage(){
  const q = state.search.toLowerCase();
  const filtered = suppliers.filter(s=> !q || s.companyName.toLowerCase().includes(q) || s.tradeName.toLowerCase().includes(q) || s.ownerName.toLowerCase().includes(q) || s.activityType.toLowerCase().includes(q) || s.governorate.toLowerCase().includes(q));

  document.getElementById('sidebar').innerHTML = '';
  document.getElementById('sidebar').style.display = 'none';

  document.getElementById('topbar').innerHTML = `
    <button class="btn btn-outline btn-sm" onclick="alert(t('dashboard'))">
      <i class="fas fa-arrow-right"></i> ${t('dashboard')}
    </button>
    <div style="flex:1;max-width:480px;margin:0 auto;position:relative">
      <i class="fas fa-search" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:14px"></i>
      <input class="search-box" placeholder="${t('search')}" value="${state.search}" oninput="handleSearch(this.value)">
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-outline btn-sm" onclick="toggleLang()"><i class="fas fa-globe"></i> ${state.lang==='ar'?'EN':'AR'}</button>
      <button class="btn btn-outline btn-sm" onclick="showPrintOptions()"><i class="fas fa-print"></i> ${t('print')}</button>
    </div>
  `;

  if(filtered.length === 0){
    document.getElementById('contentArea').innerHTML = `
      <div style="max-width:800px;margin:0 auto;padding:40px 24px">
        <div style="text-align:center;padding:80px 20px;color:var(--text2)">
          <i class="fas fa-search" style="font-size:48px;margin-bottom:16px;display:block;opacity:.2"></i>
          <div style="font-size:16px;font-weight:600">${t('noResults')}</div>
        </div>
      </div>`;
    return;
  }

  document.getElementById('contentArea').innerHTML = `
    <div style="max-width:1200px;margin:0 auto;padding:32px 24px">
      <div class="print-header"><h1 style="font-size:22px;font-weight:900">${t('supplierPanel')}</h1></div>
      <div style="margin-bottom:32px">
        <h1 style="font-size:28px;font-weight:900;margin-bottom:6px">${t('supplierPanel')}</h1>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="stat-pill"><i class="fas fa-building" style="color:var(--accent)"></i> ${filtered.length} ${t('suppliers')}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px">
        ${filtered.map((s, i) => {
          const idx = suppliers.indexOf(s);
          const ls = s.legalStatus==='ذات مسؤولية محدودة'?'limited':s.legalStatus==='شركة شخص واحد'?'sole':'partnership';
          const expDate = new Date(s.commercialRegExpiry);
          const now = new Date();
          const diff = (expDate - now) / (1000*60*60*24);
          let regBadge = '';
          if(diff < 0) regBadge = `<span class="badge badge-red" style="font-size:9px"><i class="fas fa-times-circle"></i> ${t('expired')}</span>`;
          else if(diff < 90) regBadge = `<span class="badge badge-yellow" style="font-size:9px"><i class="fas fa-exclamation-triangle"></i> ${t('expiring')}</span>`;
          else regBadge = `<span class="badge badge-green" style="font-size:9px"><i class="fas fa-check-circle"></i> ${t('active')}</span>`;

          return `
          <div class="company-card" onclick="openSupplier(${idx})" style="animation:cardIn .5s ease ${i*0.1}s both">
            <div class="card-top"><img src="${s.coverImg}" alt="${t('coverImg')}"></div>
            <div class="card-logo"><img src="${s.logo}" alt="${s.tradeName}"></div>
            <div class="card-body">
              <div class="card-name">${s.companyName}</div>
              <div class="card-trade">${s.tradeName}</div>
              <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
                <span class="stat-pill"><i class="fas fa-user-tie" style="color:var(--accent)"></i> ${s.ownerName}</span>
                <span class="stat-pill"><i class="fas fa-map-pin" style="color:var(--warn)"></i> ${s.governorate}</span>
              </div>
              <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap">
                <span class="badge badge-green" style="font-size:10px">${t(ls)}</span>
                ${regBadge}
                ${s.tax.isRegistered?`<span class="badge badge-yellow" style="font-size:10px">${s.tax.taxRate}% ${t('taxRate')}</span>`:''}
              </div>
              <div class="card-stats">
                <div class="card-stat"><div class="card-stat-val">${fmtNum(s.employeesCount)}</div><div class="card-stat-label">${t('employeesCount')}</div></div>
                <div class="card-stat"><div class="card-stat-val">${fmtNum(s.capital)}</div><div class="card-stat-label">${t('capital')} (${t('sar')})</div></div>
                <div class="card-stat"><div class="card-stat-val">${s.foundingYear}</div><div class="card-stat-label">${t('foundingYear')}</div></div>
                <div class="card-stat"><div class="card-stat-val">${s.payment.commissionRate}%</div><div class="card-stat-label">${t('commissionRate')}</div></div>
              </div>
            </div>
            <div class="card-footer">
              <span style="font-size:11px;color:var(--text2)">${s.activityType.substring(0,40)}${s.activityType.length>40?'...':''}</span>
              <span class="card-btn">${t('viewDetails')} <i class="fas fa-arrow-left"></i></span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ============ فتح صفحة المورد ============
function openSupplier(idx){
  state.current = idx;
  state.search = '';
  renderDetailPage();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============ صفحة التفاصيل ============
function renderDetailPage(){
  const s = suppliers[state.current];
  const sidebar = document.getElementById('sidebar');
  sidebar.style.display = 'block';
  if(state.lang==='en'){sidebar.style.right='auto';sidebar.style.left='0';sidebar.style.borderLeft='none';sidebar.style.borderRight='1px solid var(--border)';}
  else{sidebar.style.right='0';sidebar.style.left='auto';sidebar.style.borderLeft='1px solid var(--border)';sidebar.style.borderRight='none';}

  renderSidebar(s);
  renderDetailTopbar(s);
  renderDetailContent(s);
  setTimeout(observeSections, 100);
}

function renderSidebar(s){
  document.getElementById('sidebar').innerHTML = `
    <div style="padding:20px 18px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <img src="${s.logo}" style="width:36px;height:36px;border-radius:8px;object-fit:cover" alt="">
        <div style="min-width:0;flex:1">
          <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.tradeName}</div>
          <div style="font-size:10px;color:var(--text2)">${s.username}</div>
        </div>
      </div>
    </div>
    <div style="padding:8px 0">
      <div class="sidebar-link" onclick="goBackToList()" style="color:var(--warn);margin-bottom:4px">
        <i class="fas fa-arrow-right"></i><span>${t('backToList')}</span>
      </div>
      ${navItems.map(n=>`
        <div class="sidebar-link" onclick="scrollToSection('${n.key}',this)">
          <i class="fas ${n.icon}"></i><span>${t(n.key)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderDetailTopbar(s){
  const mainEl = document.getElementById('mainContent');
  if(state.lang==='en'){mainEl.style.marginRight='0';mainEl.style.marginLeft='260px';}
  else{mainEl.style.marginRight='260px';mainEl.style.marginLeft='0';}
  mainEl.classList.add('detail-main');

  document.getElementById('topbar').innerHTML = `
    <button class="btn btn-back" onclick="goBackToList()">
      <i class="fas fa-arrow-right"></i> ${t('backToList')}
    </button>
    <div style="flex:1;display:flex;align-items:center;gap:10px;justify-content:center">
      <img src="${s.logo}" style="width:28px;height:28px;border-radius:6px;object-fit:cover" alt="">
      <span style="font-size:14px;font-weight:700">${s.tradeName}</span>
    </div>
    <div style="display:flex;gap:6px">
      <select class="supplier-selector" onchange="switchSupplier(this.value)" style="min-width:160px">
        ${suppliers.map((sp,i)=>`<option value="${i}" ${i===state.current?'selected':''}>${sp.tradeName}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" onclick="toggleLang()"><i class="fas fa-globe"></i> ${state.lang==='ar'?'EN':'AR'}</button>
      <button class="btn btn-outline btn-sm" onclick="toggleView()"><i class="fas ${state.view==='cards'?'fa-table':'fa-th-large'}"></i></button>
      <button class="btn btn-outline btn-sm" onclick="showPrintOptions()"><i class="fas fa-print"></i></button>
    </div>
  `;
}

function renderDetailContent(s){
  if(state.view === 'table'){
    renderTableView(suppliers);
    return;
  }
  document.getElementById('contentArea').innerHTML = `
    <div style="padding:24px">
      <div class="print-header">
        <h1 style="font-size:22px;font-weight:900">${s.companyName}</h1>
        <p style="font-size:13px;color:#666">${s.tradeName} - ${t('supplierPanel')}</p>
      </div>
      ${renderLoginSection(s)}
      ${renderBasicSection(s)}
      ${renderContactSection(s)}
      ${renderAddressSection(s)}
      ${renderLegalSection(s)}
      ${renderAttachmentsSection(s)}
      ${renderBankSection(s)}
      ${renderTaxSection(s)}
      ${renderShippingSection(s)}
      ${renderPaymentSection(s)}
    </div>
  `;

function goBackToList(){
  state.current = null;
  state.search = '';
  const mainEl = document.getElementById('mainContent');
  mainEl.style.marginRight = '0';
  mainEl.style.marginLeft = '0';
  mainEl.classList.remove('detail-main');
  renderListPage();
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchSupplier(val){
  state.current = parseInt(val);
  renderDetailPage();
  window.scrollTo({top:0});
}

      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('taxNumber')}</label>
      <input class="input" id="edit-taxNumber" value="${tx.taxNumber}" style="${is}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('taxRate')} (%)</label><input class="input" id="edit-taxRate" type="number" value="${tx.taxRate}"></div>
        <div><label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('taxType')}</label><input class="input" id="edit-taxType" value="${tx.taxType}"></div>
      </div>
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('taxCountry')}</label>
      <input class="input" id="edit-taxCountry" value="${tx.taxCountry}" style="${is}">`;
  } else if(section==='shippingInfo'){
    const sh = s.shipping;
    fields = `
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('shippingCompany')}</label>
      <input class="input" id="edit-shipCompany" value="${sh.company}" style="${is}">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('shippingMethod')}</label>
      <input class="input" id="edit-shipMethod" value="${sh.method}" style="${is}">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('deliveryAreas')}</label>
      <input class="input" id="edit-deliveryAreas" value="${sh.deliveryAreas}" style="${is}">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('deliveryTime')}</label>
      <input class="input" id="edit-deliveryTime" value="${sh.deliveryTime}" style="${is}">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('shippingCost')}</label>
      <input class="input" id="edit-shippingCost" value="${sh.shippingCost}" style="${is}">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('intlShipping')}</label>
      <select class="select" id="edit-intlShipping" style="${is}">
        <option value="true" ${sh.internationalShipping?'selected':''}>${t('yes')}</option>
        <option value="false" ${!sh.internationalShipping?'selected':''}>${t('no')}</option>
      </select>`;
  } else if(section==='paymentMethods'){
    const p = s.payment;
    const allM = [t('bankTransfer'),t('eWallet'),t('cod')];
    fields = `
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('paymentType')}</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        ${allM.map(m=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;background:var(--bg);padding:6px 12px;border-radius:6px;border:1px solid var(--border)">
          <input type="checkbox" value="${m}" ${p.methods.includes(m)?'checked':''} class="pay-method-cb"> ${m}
        </label>`).join('')}
      </div>
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('payDeliveryTime')}</label>
      <input class="input" id="edit-payDelTime" value="${p.deliveryTime}" style="${is}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('minInvoice')}</label><input class="input" id="edit-minInvoice" type="number" value="${p.minInvoice}"></div>
        <div><label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('commissionRate')} (%)</label><input class="input" id="edit-commRate" type="number" value="${p.commissionRate}"></div>
      </div>
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">${t('currency')}</label>
      <input class="input" id="edit-payCurrency" value="${p.currency}" style="${is}">`;
  }

  document.getElementById('modalTitle').textContent = t(section);
  document.getElementById('modalBody').innerHTML = fields;
  document.getElementById('editModal').classList.add('show');
}

function saveEdit(){
  const s = suppliers[state.current];
  const sec = state.editSection;
  const v = id => { const el = document.getElementById(id); return el?el.value:''; };
  if(sec==='loginInfo'){s.password=v('edit-password');s.email=v('edit-email');s.securityQuestion=v('edit-secQ');s.securityAnswer=v('edit-secA');}
  else if(sec==='basicData'){s.companyName=v('edit-companyName');s.tradeName=v('edit-tradeName');s.ownerName=v('edit-ownerName');s.activityType=v('edit-activityType');s.foundingYear=parseInt(v('edit-foundingYear'))||s.foundingYear;s.employeesCount=parseInt(v('edit-employeesCount'))||s.employeesCount;s.capital=parseInt(v('edit-capital'))||s.capital;s.overview=v('edit-overview');}
  else if(sec==='contactInfo'){s.contactPerson=v('edit-contactPerson');s.contactPosition=v('edit-contactPosition');s.phone=v('edit-phone');s.altPhone=v('edit-altPhone');s.contactEmail=v('edit-contactEmail');s.website=v('edit-website');}
  else if(sec==='addresses'){s.address=v('edit-address');s.area=v('edit-area');s.governorate=v('edit-governorate');s.warehouseAddress=v('edit-warehouseAddr');s.returnAddress=v('edit-returnAddr');}
  else if(sec==='legalData'){s.commercialReg=v('edit-commercialReg');s.commercialRegIssue=v('edit-regIssue');s.commercialRegExpiry=v('edit-regExpiry');s.taxCard=v('edit-taxCard');s.taxRegistration=v('edit-taxReg');s.activityLicense=v('edit-activityLicense');s.commercialChamber=v('edit-commercialChamber');s.legalStatus=v('edit-legalStatus');}
  else if(sec==='bankAccount'){s.bank.itemName=v('edit-itemName');s.bank.accountHolder=v('edit-accountHolder');s.bank.accountNumber=v('edit-accountNumber');s.bank.iban=v('edit-iban');s.bank.swiftCode=v('edit-swiftCode');s.bank.currency=v('edit-currency');s.bank.bankCountry=v('edit-bankCountry');}
  else if(sec==='taxInfo'){s.tax.isRegistered=v('edit-isRegistered')==='true';s.tax.taxNumber=v('edit-taxNumber');s.tax.taxRate=parseFloat(v('edit-taxRate'))||s.tax.taxRate;s.tax.taxType=v('edit-taxType');s.tax.taxCountry=v('edit-taxCountry');}
  else if(sec==='shippingInfo'){s.shipping.company=v('edit-shipCompany');s.shipping.method=v('edit-shipMethod');s.shipping.deliveryAreas=v('edit-deliveryAreas');s.shipping.deliveryTime=v('edit-deliveryTime');s.shipping.shippingCost=v('edit-shippingCost');s.shipping.internationalShipping=v('edit-intlShipping')==='true';}
  else if(sec==='paymentMethods'){const ch=[...document.querySelectorAll('.pay-method-cb:checked')].map(c=>c.value);s.payment.methods=ch.length?ch:s.payment.methods;s.payment.deliveryTime=v('edit-payDelTime');s.payment.minInvoice=parseInt(v('edit-minInvoice'))||s.payment.minInvoice;s.payment.commissionRate=parseFloat(v('edit-commRate'))||s.payment.commissionRate;s.payment.currency=v('edit-payCurrency');}
  closeModal();renderDetailPage();showToast(state.lang==='ar'?'تم حفظ التغييرات بنجاح':'Changes saved successfully');
}

function closeModal(){document.getElementById('editModal').classList.remove('show');state.editSection=null;}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('show');}
function showToast(msg){const el=document.getElementById('toast');el.innerHTML=`<i class="fas fa-check-circle" style="margin-left:8px"></i>${msg}`;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

// ============ التنقل والأدوات ============
function scrollToSection(key, el){
  const target = document.getElementById('sec-'+key);
  if(target){target.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));if(el)el.classList.add('active');}
}

function toggleLang(){
  state.lang = state.lang==='ar'?'en':'ar';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar'?'rtl':'ltr';
  if(state.current !== null) renderDetailPage(); else renderListPage();
}

function toggleView(){
  state.view = state.view==='cards'?'table':'cards';
  if(state.current !== null) renderDetailContent(suppliers[state.current]);
}

function handleSearch(q){state.search=q;if(state.current!==null){state.current=null;const m=document.getElementById('mainContent');m.style.marginRight='0';m.style.marginLeft='0';m.classList.remove('detail-main');}renderListPage();}

// ============ الطباعة ============
function showPrintOptions(){
  const ov=document.createElement('div');ov.className='modal-overlay show';ov.style.zIndex='150';
  ov.innerHTML=`<div class="modal" style="max-width:400px">
    <div class="modal-header"><h3 style="font-size:15px;font-weight:700;color:var(--accent)">${t('print')}</h3>
      <button onclick="this.closest('.modal-overlay').remove()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px"><i class="fas fa-times"></i></button></div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-accent" style="width:100%;justify-content:center;padding:14px" onclick="printSupplier(${state.current!==null?state.current:0});this.closest('.modal-overlay').remove()"><i class="fas fa-file-alt"></i> ${t('printOne')}</button>
      <button class="btn btn-outline" style="width:100%;justify-content:center;padding:14px" onclick="printAllSuppliers();this.closest('.modal-overlay').remove()"><i class="fas fa-print"></i> ${t('printAll')}</button>
    </div></div>`;
  document.body.appendChild(ov);
}

    <div style="margin-top:16px;font-size:11px">

function printAllSuppliers(){
  const pa=document.getElementById('printArea');pa.style.display='block';
  pa.innerHTML=`<div class="print-header" style="display:block!important;text-align:center;margin-bottom:20px;padding-bottom:10px;border-bottom:3px double #000">
    <h1 style="font-size:20px;font-weight:900;margin:0">${t('supplierPanel')} - ${t('allSections')}</h1><p style="font-size:12px;color:#666;margin:4px 0 0">${suppliers.length} ${t('suppliers')}</p></div>
    <table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:#f0f0f0">
      <th style="border:1px solid #ccc;padding:6px;text-align:right">#</th><th style="border:1px solid #ccc;padding:6px;text-align:right">${t('companyName')}</th>
      <th style="border:1px solid #ccc;padding:6px;text-align:right">${t('ownerName')}</th><th style="border:1px solid #ccc;padding:6px;text-align:right">${t('phone')}</th>
      <th style="border:1px solid #ccc;padding:6px;text-align:right">${t('governorate')}</th><th style="border:1px solid #ccc;padding:6px;text-align:right">${t('commercialReg')}</th>
      <th style="border:1px solid #ccc;padding:6px;text-align:right">${t('legalStatus')}</th><th style="border:1px solid #ccc;padding:6px;text-align:right">${t('isRegistered')}</th>
      <th style="border:1px solid #ccc;padding:6px;text-align:right">${t('iban')}</th><th style="border:1px solid #ccc;padding:6px;text-align:right">${t('minInvoice')}</th>
      <th style="border:1px solid #ccc;padding:6px;text-align:right">${t('commissionRate')}</th></tr></thead><tbody>
      ${suppliers.map((s,i)=>{const ls=s.legalStatus==='ذات مسؤولية محدودة'?t('limited'):s.legalStatus==='شركة شخص واحد'?t('sole'):t('partnership');

        <td style="border:1px solid #ccc;padding:5px">${s.governorate}</td><td style="border:1px solid #ccc;padding:5px;direction:ltr">${s.commercialReg}</td>

        <td style="border:1px solid #ccc;padding:5px">${s.payment.commissionRate}%</td></tr>`;}).join('')}</tbody></table>

        <p><strong>${t('foundingYear')}:</strong> ${s.foundingYear} | <strong>${t('employeesCount')}:</strong> ${s.employeesCount}</p>
        <p><strong>${t('capital')}:</strong> ${fmtNum(s.capital)} ${t('sar')}</p>
        <p><strong>${t('contactPerson')}:</strong> ${s.contactPerson} - ${s.contactPosition}</p>
        <p><strong>${t('phone')}:</strong> ${s.phone} | ${s.altPhone}</p><p><strong>${t('email')}:</strong> ${s.contactEmail}</p>

  window.print();setTimeout(()=>{pa.style.display='none'},500);

// ============ تتبع الأقسام أثناء التمرير ============
const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const id = entry.target.id.replace('sec-','');
      document.querySelectorAll('.sidebar-link').forEach(l=>{l.classList.toggle('active', l.getAttribute('onclick')?.includes(id));});
    }
  });
},{threshold:0.3,rootMargin:'-80px 0px -50% 0px'});
function observeSections(){document.querySelectorAll('[id^="sec-"]').forEach(el=>observer.observe(el));}

// ============ البدء ============
renderListPage();
</script>
</body>
</html>
